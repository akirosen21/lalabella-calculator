<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flower Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f6e0da; --mint:#eaf3ec;
    --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441; --leaf:#5f8f63;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; overflow-x:hidden;
    background:#efe3da;
    color:var(--ink); font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }

  /* ---------- Blurred "photo" backdrop, bokeh-style ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(ellipse 50% 50% at 85% 75%, rgba(234,243,236,0.9), transparent 60%),
      linear-gradient(160deg, #f3e7dd 0%, #e9d8c8 45%, #e3ceb8 100%);
  }
  .bokeh{ position:absolute; border-radius:50%; filter:blur(38px); opacity:0.5; }
  .bokeh.b1{ width:180px; height:180px; background:var(--rose); top:8%; right:12%; opacity:0.22; }
  .bokeh.b2{ width:140px; height:140px; background:var(--gold); bottom:18%; left:8%; opacity:0.25; }
  .bokeh.b3{ width:220px; height:220px; background:var(--leaf); bottom:-40px; right:-30px; opacity:0.18; }
  .bokeh.b4{ width:90px; height:90px; background:#fff; top:40%; left:4%; opacity:0.5; }

  /* subtle wood-floor style texture strip at the bottom, like the reference's counter/floor */
  .floor{
    position:fixed; left:0; right:0; bottom:0; height:120px; z-index:0;
    background:linear-gradient(180deg, transparent, rgba(120,80,50,0.10) 40%, rgba(90,58,34,0.16));
  }

  .topbar{
    position:relative; z-index:5; display:flex; align-items:center; gap:10px;
    padding:16px 18px 6px;
  }
  .back-circle{
    width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.85);
    backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    text-decoration:none; color:var(--ink); font-size:16px; box-shadow:0 4px 14px rgba(0,0,0,0.1);
    flex-shrink:0;
  }
  .search-pill{
    flex:1; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.85);
    backdrop-filter:blur(6px); border-radius:24px; padding:10px 16px; color:var(--ink-dim);
    font-size:12.5px; box-shadow:0 4px 14px rgba(0,0,0,0.08);
  }

  .stage{ position:relative; z-index:2; padding:10px 0 0; }

  .eyebrow{
    text-align:center; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.34em;
    text-transform:uppercase; color:var(--rose-deep); margin:6px 0 2px;
  }
  .stage-title{
    text-align:center; font-family:'Fraunces',serif; font-weight:900; font-size:clamp(1.5rem,6vw,2rem);
    margin:0 0 18px; color:var(--ink);
  }

  /* ---------- Hero floating flower ---------- */
  .hero-wrap{ position:relative; height:220px; display:flex; align-items:center; justify-content:center; }
  .hero-shadow{
    position:absolute; width:170px; height:34px; border-radius:50%; background:rgba(60,30,20,0.22);
    filter:blur(12px); bottom:14px;
  }
  .hero-flower{
    width:168px; height:168px; border-radius:50%; position:relative;
    box-shadow:0 26px 50px rgba(158,47,74,0.28), 0 0 0 6px rgba(255,255,255,0.7);
    display:flex; align-items:center; justify-content:center; font-size:74px;
    animation:heroFloat 4s ease-in-out infinite;
    cursor:pointer; transition:transform .3s ease;
  }
  .hero-flower:active{ transform:scale(0.96); }
  @keyframes heroFloat{ 0%,100%{ transform:translateY(0) rotate(-1deg); } 50%{ transform:translateY(-10px) rotate(1deg); } }

  .float-badge{
    position:absolute; background:#fff; border-radius:14px; padding:7px 11px;
    font-size:10.5px; font-weight:700; color:var(--rose-deep); box-shadow:0 8px 20px rgba(0,0,0,0.12);
    display:flex; align-items:center; gap:5px;
  }
  .float-badge.fb1{ top:6px; right:14%; animation:badgeFloat 3.4s ease-in-out infinite; }
  .float-badge.fb2{ bottom:26px; left:10%; animation:badgeFloat 3.4s ease-in-out infinite 1s; }
  @keyframes badgeFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }

  .hero-actions{ text-align:center; margin-top:6px; }
  .hero-enter-btn{
    display:inline-flex; align-items:center; gap:7px; background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff; border:none; padding:11px 22px; border-radius:24px; font-weight:700; font-size:12.5px;
    cursor:pointer; box-shadow:0 10px 24px rgba(158,47,74,0.3); text-decoration:none;
  }

  /* ---------- Carousel ---------- */
  .carousel-wrap{ position:relative; margin-top:22px; padding:0 6px; }
  .carousel{
    display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:10px 44px 16px; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .carousel::-webkit-scrollbar{ display:none; }
  .carousel-item{
    flex:0 0 auto; width:82px; text-align:center; scroll-snap-align:center;
    cursor:pointer; opacity:0.62; transition:opacity .25s ease, transform .25s ease;
  }
  .carousel-item.active{ opacity:1; transform:translateY(-4px); }
  .carousel-circle{
    width:66px; height:66px; border-radius:50%; margin:0 auto 8px; display:flex;
    align-items:center; justify-content:center; font-size:28px; background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,0.1); border:2px solid transparent;
    transition:border-color .25s ease;
  }
  .carousel-item.active .carousel-circle{ border-color:var(--rose); box-shadow:0 10px 26px rgba(158,47,74,0.25); }
  .carousel-label{ font-size:10px; font-weight:600; color:var(--ink-dim); line-height:1.3; }
  .carousel-item.active .carousel-label{ color:var(--rose-deep); }
  .carousel-item.soon .carousel-circle{ opacity:0.5; }
  .carousel-item.soon .carousel-label{ font-style:italic; }

  .nav-arrow{
    position:absolute; top:44px; width:32px; height:32px; border-radius:50%;
    background:#fff; box-shadow:0 6px 16px rgba(0,0,0,0.14); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:3; color:var(--ink);
  }
  .nav-arrow.left{ left:-2px; }
  .nav-arrow.right{ right:-2px; }

  .desc-card{
    position:relative; z-index:2; max-width:420px; margin:14px auto 0; background:#fff;
    border-radius:18px; padding:16px 18px; box-shadow:0 12px 30px rgba(0,0,0,0.08);
    text-align:center;
  }
  .desc-card h3{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 5px; color:var(--rose-deep); }
  .desc-card p{ font-size:12px; color:var(--ink-dim); margin:0; line-height:1.5; }

  /* ---------- Bottom dock ---------- */
  .dock{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:10;
    display:flex; gap:6px; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    padding:9px; border-radius:30px; box-shadow:0 14px 34px rgba(0,0,0,0.16);
  }
  .dock a, .dock button{
    width:42px; height:42px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--ink-dim);
    text-decoration:none; cursor:pointer;
  }
  .dock a.active, .dock a:hover{ background:var(--blush); color:var(--rose-deep); }

  .page-body{ padding-bottom:100px; }

  @media (min-width:640px){
    .hero-wrap{ height:260px; }
    .hero-flower{ width:200px; height:200px; font-size:88px; }
  }
</style>
</head>
<body>
<div class="backdrop">
  <div class="bokeh b1"></div>
  <div class="bokeh b2"></div>
  <div class="bokeh b3"></div>
  <div class="bokeh b4"></div>
</div>
<div class="floor"></div>

<div class="page-body">
  <div class="topbar">
    <a class="back-circle" href="index.html">←</a>
    <div class="search-pill">🔍 Find a flower tool…</div>
  </div>

  <div class="stage">
    <div class="eyebrow">Lalabella Flowers</div>
    <div class="stage-title">Flower Tools Garden</div>

    <div class="hero-wrap">
      <div class="float-badge fb1" id="statusBadge">🌱 Live</div>
      <div class="float-badge fb2">🌹 4 tools</div>
      <div class="hero-shadow"></div>
      <div class="hero-flower" id="heroFlower" style="background:radial-gradient(circle at 35% 30%, #ffd9e0, #e0708a 45%, #8c3a52 90%);">📊</div>
    </div>

    <div class="hero-actions">
      <a class="hero-enter-btn" id="enterBtn" href="flower-dashboard.html">Open Dashboard →</a>
    </div>

    <div class="carousel-wrap">
      <button class="nav-arrow left" id="navLeft">‹</button>
      <div class="carousel" id="carousel">
        <div class="carousel-item active" data-icon="📊" data-color="#e0708a,#8c3a52" data-title="Dashboard" data-desc="Purchases, budget, and rate approvals at a glance." data-href="flower-dashboard.html">
          <div class="carousel-circle">📊</div>
          <div class="carousel-label">Dashboard</div>
        </div>
        <div class="carousel-item" data-icon="📦" data-color="#d9a441,#c8873a" data-title="Flower Receiving" data-desc="Log supplier deliveries with automatic rate calculation." data-href="flower-receiving.html">
          <div class="carousel-circle">📦</div>
          <div class="carousel-label">Receiving</div>
        </div>
        <div class="carousel-item" data-icon="📋" data-color="#5f8f63,#3f6b45" data-title="Stock Count" data-desc="Physical counts, wastage, and stock value by flower name." data-href="flower-stock-count.html">
          <div class="carousel-circle">📋</div>
          <div class="carousel-label">Stock Count</div>
        </div>
        <div class="carousel-item soon" data-icon="🌱" data-color="#c9506b,#9e2f4a" data-title="Flower Stock" data-desc="Consolidated stock levels across every branch." data-href="flower-purchase.html">
          <div class="carousel-circle">🌱</div>
          <div class="carousel-label">Stock (soon)</div>
        </div>
      </div>
      <button class="nav-arrow right" id="navRight">›</button>
    </div>

    <div class="desc-card">
      <h3 id="descTitle">Dashboard</h3>
      <p id="descText">Purchases, budget, and rate approvals at a glance.</p>
    </div>
  </div>
</div>

<div class="dock">
  <a href="index.html" title="Home">🏠</a>
  <a href="flower-receiving.html" title="Receiving">📦</a>
  <a href="flower-dashboard.html" title="Dashboard">📊</a>
  <a href="chatbox.html" title="Messages">💬</a>
</div>

<script>
  const items = Array.from(document.querySelectorAll('.carousel-item'));
  const heroFlower = document.getElementById('heroFlower');
  const enterBtn = document.getElementById('enterBtn');
  const descTitle = document.getElementById('descTitle');
  const descText = document.getElementById('descText');
  const carousel = document.getElementById('carousel');

  function selectItem(item){
    items.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const icon = item.dataset.icon;
    const color = item.dataset.color.split(',');
    heroFlower.textContent = icon;
    heroFlower.style.background = `radial-gradient(circle at 35% 30%, #fff2d8, ${color[0]} 45%, ${color[1]} 90%)`;
    descTitle.textContent = item.dataset.title;
    descText.textContent = item.dataset.desc;
    enterBtn.href = item.dataset.href;
    enterBtn.textContent = 'Open ' + item.dataset.title + ' →';
  }

  items.forEach(item => {
    item.addEventListener('click', ()=>{
      selectItem(item);
      item.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    });
  });

  heroFlower.addEventListener('click', ()=>{
    const active = document.querySelector('.carousel-item.active');
    if(active) window.location.href = active.dataset.href;
  });

  document.getElementById('navLeft').addEventListener('click', ()=>{
    carousel.scrollBy({ left: -110, behavior:'smooth' });
  });
  document.getElementById('navRight').addEventListener('click', ()=>{
    carousel.scrollBy({ left: 110, behavior:'smooth' });
  });
</script>
</body>
</html>
