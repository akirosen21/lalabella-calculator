<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lalabella — Price Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cacao:#0d0806;
    --cacao-2:#1a100c;
    --foil:#e8c46a;
    --foil-hot:#ffdd7a;
    --cream:#f5ecdf;
    --dim:#8a7568;
    --line:#332218;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cacao);
    color:var(--cream);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* foil ribbon signature */
  .ribbon{
    position:fixed;
    top:0; left:0; right:0;
    height:14px;
    background:repeating-linear-gradient(
      -45deg,
      var(--foil), var(--foil) 18px,
      var(--foil-hot) 18px, var(--foil-hot) 36px
    );
    background-size:200% 100%;
    z-index:10;
    animation: ribbonShift 6s linear infinite;
  }
  @keyframes ribbonShift{
    from{ background-position:0% 0; }
    to{ background-position:-100% 0; }
  }
  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes pulseGold{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.09); color:var(--foil-hot); }
    100%{ transform:scale(1); }
  }
  @keyframes popIn{
    0%{ opacity:0; transform:translateY(-6px) scale(.96); }
    60%{ opacity:1; transform:translateY(1px) scale(1.01); }
    100%{ transform:translateY(0) scale(1); }
  }
  @keyframes shimmerSweep{
    0%{ background-position:-150% 0; }
    100%{ background-position:250% 0; }
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:60px 20px 80px;
  }
  header{
    text-align:center;
    margin-bottom:40px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.4em;
    text-transform:uppercase;
    color:var(--foil);
    margin-bottom:14px;
    font-weight:700;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(2.6rem, 9vw, 4.2rem);
    line-height:0.95;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    color:var(--foil);
  }
  .sub{
    color:var(--dim);
    font-size:14px;
    max-width:340px;
    margin:0 auto;
  }
  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  #search{
    width:100%;
    background:var(--cacao-2);
    border:2px solid var(--line);
    border-radius:2px;
    padding:18px 46px 18px 20px;
    font-size:16px;
    color:var(--cream);
    font-family:'Space Grotesk',sans-serif;
    outline:none;
    transition:border-color .15s ease;
  }
  #search::placeholder{color:#5a463a;}
  #search:focus{border-color:var(--foil);}
  #clearBtn{
    position:absolute;
    right:14px; top:50%;
    transform:translateY(-50%);
    background:none; border:none;
    color:var(--dim);
    font-size:20px;
    cursor:pointer;
    display:none;
    line-height:1;
  }
  #results{
    border:2px solid var(--line);
    border-top:none;
    margin-top:-14px;
    margin-bottom:20px;
    max-height:320px;
    overflow-y:auto;
    display:none;
  }
  .result-item{
    padding:14px 20px;
    border-top:1px solid var(--line);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    transition:background .1s ease;
    animation: fadeSlideUp .22s ease both;
  }
  .result-item:hover{background:var(--cacao-2);}
  .result-name{font-size:14px;font-weight:500;}
  .result-meta{font-size:11px;color:var(--dim);margin-top:3px;}
  .result-price{font-size:14px;color:var(--foil);font-weight:700;white-space:nowrap;}
  .empty-note{padding:16px 20px;color:var(--dim);font-size:13px;}

  #card{
    display:none;
    border:2px solid var(--foil);
    padding:26px 24px;
    position:relative;
    background:var(--cacao-2);
    animation: cardIn .28s cubic-bezier(.2,.8,.2,1) both;
  }
  #card::before{
    content:"";
    position:absolute;
    top:-2px; left:-2px; right:-2px;
    height:6px;
    background:repeating-linear-gradient(-45deg,var(--foil),var(--foil) 10px,transparent 10px,transparent 20px);
  }
  .item-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    padding-bottom:20px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .item-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    line-height:1.1;
  }
  .item-sub{
    font-size:12px;
    color:var(--dim);
    margin-top:6px;
  }
  .change-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:6px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .change-btn:hover{border-color:var(--foil); color:var(--foil);}

  .mode-toggle{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:16px;
  }
  .mode-btn{
    padding:12px 0;
    text-align:center;
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:all .12s ease;
  }
  .mode-btn.active{
    background:var(--foil);
    border-color:var(--foil);
    color:var(--cacao);
  }

  #amount{
    width:100%;
    background:var(--cacao);
    border:2px solid var(--line);
    padding:16px 18px;
    font-size:18px;
    color:var(--cream);
    font-family:'Space Grotesk',sans-serif;
    outline:none;
    margin-bottom:20px;
  }
  #amount:focus{border-color:var(--foil);}

  .total-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    background:var(--cacao);
    border:1px solid var(--line);
  }
  .total-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--dim);
  }
  .total-kg{
    font-size:12px;
    color:var(--dim);
    margin-top:4px;
  }
  .total-amount{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:34px;
    color:var(--foil-hot);
  }

  .add-btn{
    width:100%;
    margin-top:14px;
    padding:15px 0;
    background:var(--foil);
    border:none;
    color:var(--cacao);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    cursor:pointer;
    transition:background .12s ease;
  }
  .add-btn:hover{background:var(--foil-hot);}
  .add-btn:disabled{
    background:var(--line);
    color:var(--dim);
    cursor:not-allowed;
  }

  #listSection{
    display:none;
    margin-top:32px;
  }
  .list-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }
  .list-header h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    margin:0;
  }
  .list-clear{
    background:none;
    border:none;
    color:var(--dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    cursor:pointer;
  }
  .list-clear:hover{color:var(--foil);}

  #listItems{
    border:1px solid var(--line);
    margin-bottom:16px;
  }
  .list-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-top:1px solid var(--line);
  }
  .list-row:first-child{border-top:none;}
  .list-row-name{
    font-size:13px;
    font-weight:500;
  }
  .list-row-meta{
    font-size:11px;
    color:var(--dim);
    margin-top:3px;
  }
  .list-row-right{
    display:flex;
    align-items:center;
    gap:12px;
    white-space:nowrap;
  }
  .list-row-price{
    font-size:13px;
    color:var(--foil);
    font-weight:700;
  }
  .list-row-remove{
    background:none;
    border:none;
    color:var(--dim);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:0;
  }
  .list-row-remove:hover{color:#e05a4e;}

  .grand-total-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 20px;
    background:var(--cacao-2);
    border:2px solid var(--foil);
  }
  .grand-total-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--dim);
  }
  .grand-total-count{
    font-size:12px;
    color:var(--dim);
    margin-top:4px;
  }
  .grand-total-amount{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:38px;
    color:var(--foil-hot);
  }

  .print-btn{
    width:100%;
    margin-top:12px;
    padding:14px 0;
    background:transparent;
    border:1px solid var(--foil);
    color:var(--foil);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    cursor:pointer;
    transition:all .12s ease;
  }
  .print-btn:hover{background:var(--foil); color:var(--cacao);}

  /* Print-only receipt, hidden on screen */
  #receipt{display:none;}

  @media print{
    body *{ visibility:hidden; }
    .ribbon{ display:none; }
    #receipt, #receipt *{ visibility:visible; }
    #receipt{
      display:block;
      position:absolute;
      top:0; left:0;
      width:80mm;
      background:#fff;
      color:#111;
      font-family:'Space Grotesk',sans-serif;
      padding:6mm;
    }
    @page{ size:80mm auto; margin:0; }
    #receipt h1{
      font-family:'Fraunces',serif;
      font-size:16px;
      text-align:center;
      margin:0 0 2px;
      letter-spacing:0.05em;
    }
    #receipt .r-sub{
      text-align:center;
      font-size:9px;
      color:#555;
      margin-bottom:8px;
    }
    #receipt .r-line{
      border-top:1px dashed #999;
      margin:6px 0;
    }
    #receipt .r-row{
      display:flex;
      justify-content:space-between;
      font-size:11px;
      margin-bottom:5px;
    }
    #receipt .r-row .r-name{ flex:1; padding-right:6px; }
    #receipt .r-row .r-meta{
      font-size:9px;
      color:#555;
      display:block;
    }
    #receipt .r-grand{
      display:flex;
      justify-content:space-between;
      font-size:14px;
      font-weight:700;
      margin-top:8px;
    }
    #receipt .r-footer{
      text-align:center;
      font-size:9px;
      color:#555;
      margin-top:10px;
    }
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--dim);
    text-decoration:none;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:24px;
    transition:color .12s ease;
  }
  .back-link:hover{ color:var(--foil); }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <div class="wrap">
    <a class="back-link" href="index.html">&larr; Back to Tools</a>
    <header>
      <div class="eyebrow">Lalabella</div>
      <h1>Presyo, <em>Instant</em>.</h1>
      <p class="sub">Hanapin ang chocolate, ilagay ang dami — piraso, grams, o kilo.</p>
    </header>

    <div class="search-box">
      <input id="search" type="text" placeholder="I-type ang pangalan ng chocolate..." autocomplete="off" />
      <button id="clearBtn" aria-label="Clear">&times;</button>
    </div>

    <div id="results"></div>

    <div id="card">
      <div class="item-head">
        <div>
          <div class="item-title" id="itemName"></div>
          <div class="item-sub" id="itemMeta"></div>
        </div>
        <button class="change-btn" id="changeBtn">Palitan</button>
      </div>

      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="pieces">Pieces</button>
        <button class="mode-btn" data-mode="grams">Grams</button>
        <button class="mode-btn" data-mode="kg">Kg</button>
      </div>

      <input id="amount" type="number" min="0" placeholder="Ilang piraso?" />

      <div class="total-box">
        <div>
          <div class="total-label">Total</div>
          <div class="total-kg" id="totalKg">—</div>
        </div>
        <div class="total-amount" id="totalAmount">0.000 BD</div>
      </div>

      <button class="add-btn" id="addBtn" disabled>Idagdag sa Listahan</button>
    </div>

    <div id="listSection">
      <div class="list-header">
        <h2>Listahan</h2>
        <button class="list-clear" id="clearListBtn">I-clear lahat</button>
      </div>
      <div id="listItems"></div>
      <div class="grand-total-box">
        <div>
          <div class="grand-total-label">Grand Total</div>
          <div class="grand-total-count" id="grandCount">—</div>
        </div>
        <div class="grand-total-amount" id="grandTotal">0.000 BD</div>
      </div>

      <button class="print-btn" id="printBtn">I-Print / I-Save as PDF</button>
    </div>
  </div>

  <div id="receipt">
    <h1>Lalabella</h1>
    <div class="r-sub" id="rDate"></div>
    <div class="r-line"></div>
    <div id="rItems"></div>
    <div class="r-line"></div>
    <div class="r-grand">
      <span>Grand Total</span>
      <span id="rGrandTotal">0.000 BD</span>
    </div>
    <div class="r-footer">Salamat po!</div>
  </div>

<script>
  const DATA = [
    ["Rocher Almond SMALL","Dlx 312 (B)","Lalabella","Rocher Collection",29.000,15],
    ["Rocher Pistachio SMALL","Dlx 313 (B)","Lalabella","Rocher Collection",29.000,15],
    ["Rocher Hazelnut SMALL","Dlx 310 (B)","Lalabella","Rocher Collection",29.000,15],
    ["Praline Pistachio SMALL","Dlx304 (B)","Lalabella","Deluxe Collection",30.000,20],
    ["Croquent Hazelnut SMALL","Dlx314 (B)","Lalabella","Deluxe Collection",25.000,20],
    ["Almond Praline Ball","Dlx318","Lalabella","Deluxe Collection",27.000,20],
    ["Pistachio Walnut","Dlx336","Lalabella","Deluxe Collection",26.500,25],
    ["Caramel Hazelnut Pcs","Dlx321","Lalabella","Deluxe Collection",30.000,25],
    ["Round Almond Croquent Dipped Chocolate","LX2578","Lalabella","Special Collection",25.000,20],
    ["Almond Coconut Ball","N/A","Lalabella","Special Collection",27.000,20],
    ["NAI","B13","Lalabella","Special Collection",24.000,30],
    ["Crush Almond BAR Chocolate","N/A","N/A","Special Collection",25.00,50],
    ["Alicia","B49","Lalabella","Special Collection",25.000,25],
    ["Giandoja","N/A","N/A","Premium Collection",28.000,15],
    ["Pecan Milk Chocolate","N/A","N/A","Premium Collection",28.000,15],
    ["HandMade Hazelnut","N/A","N/A","Premium Collection",28.000,15],
    ["Rahash Cream With Pistachio","N/A","N/A","Premium Collection",28.000,15],
    ["Hazel Praline","N/A","N/A","Premium Collection",28.000,15],
    ["Ajassa","N/A","N/A","Premium Collection",37.000,20],
    ["Rahash Mixed Chocolates","LX3335 C-45","N/A","New Collection",24.000,10],
    ["Croquent Pistachio Walnut Caramel Pecan","DLX 335 C","N/A","New Collection",24.000,20],
    ["Wafer Croquent Pistachios Caramal","LX2485","Lalabella","New Collection",24.000,25],
    ["White Praline Crush Coffee Chocolate","N/A","N/A","New Collection",28.000,15],
    ["Praline Coffee Mix Chocolate","LX3336","Lalabella","New Collection",28.000,10],
    ["Mango Cream Crushed Almond","N/A","N/A","New Collection",31.000,15],
    ["Honey Comb Dipped","LX331","N/A","New Collection",24.000,15],
    ["Melban Mastick Dipped Dark","N/A","N/A","New Collection",24.000,10],
    ["Pistachio Croquent Square Caramel","Dlx335 (B)","Lalabella","New Collection",24.000,15],
    ["Melban Rose Dipped Dark","N/A","N/A","New Collection",24.000,10],
    ["Mia Green","TA70","N/A","Mia Collection",24.000,20],
    ["Mia Blue","TA67","N/A","Mia Collection",24.000,20],
    ["Mia Gold","TA69","N/A","Mia Collection",24.000,20],
    ["Mia Pink","TA68","N/A","Mia Collection",24.000,20],
    ["Mia Purple","TA73","N/A","Mia Collection",24.000,20],
    ["Mia White","TA72","N/A","Mia Collection",24.000,20],
    ["Mia Black","N/A","N/A","Mia Collection",24.000,20],
    ["Mia Silver","TA66","N/A","Mia Collection",24.000,20],
    ["Stick Green","1147","N/A","Stick Collection",22.000,20],
    ["Stick Gold","1147","N/A","Stick Collection",22.000,20],
    ["Stick Blue","1147","N/A","Stick Collection",22.000,20],
    ["Stick Pink","1147","N/A","Stick Collection",22.000,20],
    ["Stick Silver","1147","N/A","Stick Collection",22.000,20],
    ["Crushed Hazelnut","SP211 C17","N/A","Corporate Collection",22.000,15],
    ["Crushed Pistacio","SP351 C17","N/A","Corporate Collection",22.000,15],
    ["Crushed Almond","LX 1252 C17","N/A","Corporate Collection",22.000,15],
    ["Plain Milk Chocolate","SP229 C17","N/A","Corporate Collection",22.000,15]
  ].map((r,i)=>({id:i,name:r[0],code:r[1],brand:r[2],category:r[3],pricePerKg:r[4],grams:r[5]}));

  const fmtBD = n => n.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + " BD";

  const searchEl = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const resultsEl = document.getElementById('results');
  const cardEl = document.getElementById('card');
  const itemNameEl = document.getElementById('itemName');
  const itemMetaEl = document.getElementById('itemMeta');
  const changeBtn = document.getElementById('changeBtn');
  const amountEl = document.getElementById('amount');
  const totalKgEl = document.getElementById('totalKg');
  const totalAmountEl = document.getElementById('totalAmount');
  const modeButtons = document.querySelectorAll('.mode-btn');
  const addBtn = document.getElementById('addBtn');
  const listSection = document.getElementById('listSection');
  const listItemsEl = document.getElementById('listItems');
  const clearListBtn = document.getElementById('clearListBtn');
  const grandCountEl = document.getElementById('grandCount');
  const grandTotalEl = document.getElementById('grandTotal');
  const printBtn = document.getElementById('printBtn');
  const rDateEl = document.getElementById('rDate');
  const rItemsEl = document.getElementById('rItems');
  const rGrandTotalEl = document.getElementById('rGrandTotal');

  let selected = null;
  let mode = 'pieces';
  let currentKg = 0;
  let currentTotal = 0;
  let cart = [];

  function renderResults(query){
    const q = query.trim().toLowerCase();
    if(!q){ resultsEl.style.display='none'; resultsEl.innerHTML=''; return; }
    const matches = DATA.filter(r =>
      r.name.toLowerCase().includes(q) ||
      r.code.toLowerCase().includes(q) ||
      r.category.toLowerCase().includes(q)
    ).slice(0,8);

    resultsEl.innerHTML = '';
    if(matches.length === 0){
      resultsEl.innerHTML = '<div class="empty-note">Walang nahanap na chocolate.</div>';
    } else {
      matches.forEach(r=>{
        const row = document.createElement('div');
        row.className = 'result-item';
        row.innerHTML = `
          <div>
            <div class="result-name">${r.name}</div>
            <div class="result-meta">${r.category} · ${r.code} · ${r.grams}g/pc</div>
          </div>
          <div class="result-price">${fmtBD(r.pricePerKg)}/kg</div>
        `;
        row.addEventListener('click', ()=> selectItem(r));
        resultsEl.appendChild(row);
      });
    }
    resultsEl.style.display = 'block';
  }

  function selectItem(item){
    selected = item;
    searchEl.value = item.name;
    resultsEl.style.display = 'none';
    cardEl.style.display = 'block';
    itemNameEl.textContent = item.name;
    itemMetaEl.textContent = `${item.code} · ${item.grams}g bawat piraso · ${fmtBD(item.pricePerKg)}/kg`;
    amountEl.value = '';
    addBtn.disabled = true;
    setMode('pieces');
    updateTotal();
  }

  function setMode(m){
    mode = m;
    modeButtons.forEach(b=> b.classList.toggle('active', b.dataset.mode === m));
    amountEl.placeholder = m === 'pieces' ? 'Ilang piraso?' : m === 'grams' ? 'Ilang grams?' : 'Ilang kg?';
    amountEl.value = '';
    updateTotal();
  }

  function updateTotal(){
    const n = parseFloat(amountEl.value);
    if(!selected || amountEl.value === '' || isNaN(n) || n < 0){
      totalKgEl.textContent = '—';
      totalAmountEl.textContent = '0.000 BD';
      currentKg = 0;
      currentTotal = 0;
      addBtn.disabled = true;
      return;
    }
    let kg;
    if(mode === 'pieces') kg = (n * selected.grams) / 1000;
    else if(mode === 'grams') kg = n / 1000;
    else kg = n;
    const total = kg * selected.pricePerKg;
    totalKgEl.textContent = kg.toFixed(3) + ' kg';
    totalAmountEl.textContent = fmtBD(total);
    currentKg = kg;
    currentTotal = total;
    addBtn.disabled = !(n > 0);
  }

  function qtyLabel(n, m){
    if(m === 'pieces') return n + ' pc' + (n != 1 ? 's' : '');
    if(m === 'grams') return n + ' g';
    return n + ' kg';
  }

  function renderCart(){
    if(cart.length === 0){
      listSection.style.display = 'none';
      return;
    }
    listSection.style.display = 'block';
    listItemsEl.innerHTML = '';
    let grandTotal = 0;
    cart.forEach((entry, idx)=>{
      grandTotal += entry.total;
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `
        <div>
          <div class="list-row-name">${entry.name}</div>
          <div class="list-row-meta">${qtyLabel(entry.amount, entry.mode)} · ${entry.kg.toFixed(3)} kg</div>
        </div>
        <div class="list-row-right">
          <div class="list-row-price">${fmtBD(entry.total)}</div>
          <button class="list-row-remove" data-idx="${idx}" aria-label="Alisin">&times;</button>
        </div>
      `;
      listItemsEl.appendChild(row);
    });
    grandCountEl.textContent = cart.length + (cart.length === 1 ? ' item' : ' items');
    grandTotalEl.textContent = fmtBD(grandTotal);

    listItemsEl.querySelectorAll('.list-row-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        cart.splice(Number(btn.dataset.idx), 1);
        renderCart();
      });
    });
  }

  searchEl.addEventListener('input', e=>{
    selected = null;
    cardEl.style.display = 'none';
    clearBtn.style.display = e.target.value ? 'block' : 'none';
    renderResults(e.target.value);
  });

  clearBtn.addEventListener('click', ()=>{
    searchEl.value = '';
    selected = null;
    cardEl.style.display = 'none';
    resultsEl.style.display = 'none';
    clearBtn.style.display = 'none';
    searchEl.focus();
  });

  changeBtn.addEventListener('click', ()=>{
    selected = null;
    searchEl.value = '';
    cardEl.style.display = 'none';
    resultsEl.style.display = 'none';
    clearBtn.style.display = 'none';
    searchEl.focus();
  });

  modeButtons.forEach(b=>{
    b.addEventListener('click', ()=> setMode(b.dataset.mode));
  });

  amountEl.addEventListener('input', updateTotal);

  addBtn.addEventListener('click', ()=>{
    if(!selected || currentTotal <= 0) return;
    cart.push({
      name: selected.name,
      amount: parseFloat(amountEl.value),
      mode: mode,
      kg: currentKg,
      total: currentTotal
    });
    renderCart();
    // reset for next entry
    selected = null;
    searchEl.value = '';
    cardEl.style.display = 'none';
    resultsEl.style.display = 'none';
    clearBtn.style.display = 'none';
    searchEl.focus();
  });

  clearListBtn.addEventListener('click', ()=>{
    cart = [];
    renderCart();
  });

  printBtn.addEventListener('click', ()=>{
    if(cart.length === 0) return;
    rDateEl.textContent = new Date().toLocaleString('en-GB', {
      day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
    });
    rItemsEl.innerHTML = '';
    let grandTotal = 0;
    cart.forEach(entry=>{
      grandTotal += entry.total;
      const row = document.createElement('div');
      row.className = 'r-row';
      row.innerHTML = `
        <div class="r-name">${entry.name}<span class="r-meta">${qtyLabel(entry.amount, entry.mode)}</span></div>
        <div>${fmtBD(entry.total)}</div>
      `;
      rItemsEl.appendChild(row);
    });
    rGrandTotalEl.textContent = fmtBD(grandTotal);
    window.print();
  });
</script>
</body>
</html>
