<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chocolate Receiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ede0;
    --paper-2:#e9e0c8;
    --ink:#1c2b45;
    --ink-dim:#5c6a83;
    --rust:#b0442e;
    --gold:#c68a1f;
    --line:#c9bfa0;
    --ok:#3d7a4f;
    --amber:#c68a1f;
    --expired:#7a2020;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
    transition:color .12s ease;
  }
  .back-link:hover{ color:var(--rust); }

  header{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900;
    font-size:clamp(1.8rem,7vw,2.6rem); margin:0 0 6px; line-height:1;
  }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
    margin-bottom:20px; background:var(--paper-2); padding:5px; border-radius:3px;
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-dim); cursor:pointer; border-radius:2px;
  }
  .branch-tab.active{ background:var(--ink); color:var(--paper); }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:20px; margin-bottom:18px;
  }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;
  }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-dim); margin-bottom:5px; margin-top:14px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%; background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:14px;
    color:var(--ink); outline:none;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--ink); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-2 > div{ min-width:0; }
  .item-meta-line{
    font-size:11.5px; color:var(--ink-dim); margin-top:6px;
    background:var(--paper); border:1px dashed var(--line); border-radius:3px; padding:8px 10px;
    display:none;
  }
  .item-meta-line.show{ display:block; }

  .submit-btn{
    width:100%; margin-top:18px; padding:14px 0; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .submit-btn:hover{ background:#14213a; }
  .submit-btn:disabled{ background:var(--line); cursor:not-allowed; }

  .inline-add-row{ display:flex; gap:8px; margin-top:8px; }
  .inline-add-row input{ flex:1; }
  .inline-add-btn{
    background:transparent; border:1px solid var(--ink); color:var(--ink);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:0 14px; border-radius:3px; cursor:pointer; white-space:nowrap;
  }

  .print-link{
    background:none; border:1px solid var(--ink); color:var(--ink);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer;
  }
  .refresh-link{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer; margin-bottom:14px;
  }

  .hist-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .hist-row{ border-top:1px solid var(--line); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .hist-remarks{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; font-style:italic; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:20px 0; }

  .status-pill{
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em;
    padding:2px 8px; border-radius:10px; font-weight:700; white-space:nowrap;
  }
  .status-good{ background:#e3f0e6; color:var(--ok); }
  .status-near{ background:#fbf1de; color:var(--amber); }
  .status-urgent{ background:#fbe6d9; color:#c05a1f; }
  .status-expired{ background:#f6e0e0; color:var(--expired); }

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block !important; position:absolute; top:0; left:0; width:100%;
      padding:16px; color:#111; font-family:'Space Grotesk',sans-serif;
    }
    #printArea h2{ font-family:'Fraunces',serif; margin-bottom:2px; }
    #printArea .p-sub{ font-size:11px; color:#555; margin-bottom:14px; }
    #printArea table{ width:100%; border-collapse:collapse; font-size:10px; }
    #printArea th, #printArea td{ border:1px solid #999; padding:5px 6px; text-align:left; }
  }
  #printArea{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Chocolate Receiving</h1>
    <p class="sub">Log incoming stock, per branch</p>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>

  <button class="refresh-link" id="refreshBtn">↻ Refresh Data</button>

  <div class="card">
    <div class="card-title">Receive Stock</div>

    <label>Chocolate Name</label>
    <input type="text" id="fSearch" list="itemList" placeholder="Type or pick a chocolate" autocomplete="off" />
    <datalist id="itemList"></datalist>
    <div class="item-meta-line" id="itemMetaLine"></div>

    <div class="grid-2">
      <div>
        <label>Receive Date</label>
        <input type="date" id="fDate" />
      </div>
      <div>
        <label>Delivery Note No.</label>
        <input type="text" id="fDeliveryNo" placeholder="Optional" />
      </div>
    </div>

    <label>Supplier</label>
    <select id="fSupplier">
      <option value="">Select supplier...</option>
      <option value="__add_new__">+ Add new supplier</option>
    </select>
    <div class="inline-add-row" id="newSupplierRow" style="display:none;">
      <input type="text" id="fNewSupplier" placeholder="New supplier name" />
      <button type="button" class="inline-add-btn" id="confirmNewSupplierBtn">Add</button>
    </div>

    <div class="grid-2">
      <div>
        <label>Batch No.</label>
        <input type="text" id="fBatchNo" placeholder="Optional" />
      </div>
      <div>
        <label>Expiry Date</label>
        <input type="date" id="fExpiryDate" />
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Qty Received</label>
        <input type="number" id="fQty" min="0" step="0.01" placeholder="0" />
      </div>
      <div>
        <label>Unit</label>
        <select id="fUnit"></select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Price / Kg (BD)</label>
        <input type="number" id="fPrice" min="0" step="0.001" placeholder="0.000" />
      </div>
      <div>
        <label>Storage Location</label>
        <select id="fStorageLocation"></select>
      </div>
    </div>

    <label>Tray / Colour Code</label>
    <input type="text" id="fTrayCode" placeholder="Optional" />

    <label>Received By</label>
    <input type="text" id="fReceivedBy" list="receivedByList" placeholder="Type or pick a name" autocomplete="off" />
    <datalist id="receivedByList"></datalist>

    <label>Remarks</label>
    <textarea id="fRemarks" rows="2" placeholder="Optional"></textarea>

    <button class="submit-btn" id="logBtn">Log Receiving</button>
  </div>

  <div class="card">
    <div class="hist-header">
      <span class="card-title" style="margin:0;">Recent Stock (This Branch)</span>
      <button class="print-link" id="printBtn">Print</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<div id="printArea">
  <h2>Lalabella — Chocolate Receiving</h2>
  <div class="p-sub" id="pMeta"></div>
  <table>
    <thead>
      <tr><th>ID</th><th>Date</th><th>Chocolate</th><th>Batch</th><th>Qty</th><th>Unit</th><th>Price/Kg</th><th>Expiry</th><th>Status</th><th>Received By</th></tr>
    </thead>
    <tbody id="pTableBody"></tbody>
  </table>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxmeqPbitk6bi88xuP06OUtnnd2bMnl5sFJbhoxXu8CaE8qe7ESZqwrupnd1K4Ijpo/exec';
  const BRANCHES = ['ModaMall','Hamala','Galali'];
  let currentBranch = 'ModaMall';

  let items = [];
  let suppliers = [];
  let receivedByNames = [];
  let storageLocations = [];
  let units = [];
  let entries = [];
  let selectedItem = null;

  const NEAR_EXPIRY_DAYS = 30;

  function daysLeft(expiryDateStr){
    if(!expiryDateStr) return null;
    const exp = new Date(expiryDateStr);
    const today = new Date();
    today.setHours(0,0,0,0);
    exp.setHours(0,0,0,0);
    return Math.round((exp - today) / (1000*60*60*24));
  }

  function statusFor(expiryDateStr){
    const d = daysLeft(expiryDateStr);
    if(d === null) return { label:'—', cls:'' };
    if(d < 0) return { label:'EXPIRED', cls:'status-expired' };
    if(d === 0) return { label:'URGENT', cls:'status-urgent' };
    if(d <= NEAR_EXPIRY_DAYS) return { label:'NEAR EXPIRY', cls:'status-near' };
    return { label:'GOOD', cls:'status-good' };
  }

  function fmtBD(n){
    return Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD';
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  async function loadData(){
    try{ items = await (await fetch(API_URL + '?action=getItems')).json(); }catch(e){ console.error(e); }
    try{ suppliers = await (await fetch(API_URL + '?action=getSuppliers')).json(); }catch(e){ console.error(e); }
    try{ receivedByNames = await (await fetch(API_URL + '?action=getReceivedBy')).json(); }catch(e){ console.error(e); }
    try{ storageLocations = await (await fetch(API_URL + '?action=getStorageLocations')).json(); }catch(e){ console.error(e); }
    try{ units = await (await fetch(API_URL + '?action=getUnits')).json(); }catch(e){ console.error(e); }
    try{ entries = await (await fetch(API_URL + '?action=getEntries')).json(); }catch(e){ console.error(e); }

    populateItemList();
    populateSupplierDropdown();
    populateReceivedByList();
    populateSelect('fStorageLocation', storageLocations);
    populateSelect('fUnit', units);
    renderHistory();
  }

  function populateItemList(){
    document.getElementById('itemList').innerHTML =
      items.map(it => `<option value="${it['Chocolate Name']}"></option>`).join('');
  }

  function populateSupplierDropdown(){
    const sel = document.getElementById('fSupplier');
    const currentVal = sel.value;
    sel.innerHTML = '<option value="">Select supplier...</option>' +
      suppliers.map(s => `<option value="${s}">${s}</option>`).join('') +
      '<option value="__add_new__">+ Add new supplier</option>';
    if(suppliers.includes(currentVal)) sel.value = currentVal;
  }

  function populateReceivedByList(){
    document.getElementById('receivedByList').innerHTML =
      receivedByNames.map(n => `<option value="${n}"></option>`).join('');
  }

  function populateSelect(id, values){
    const sel = document.getElementById(id);
    sel.innerHTML = values.map(v => `<option value="${v}">${v}</option>`).join('');
  }

  document.getElementById('fSearch').addEventListener('input', function(){
    const match = items.find(it => it['Chocolate Name'] === this.value);
    const metaLine = document.getElementById('itemMetaLine');
    if(match){
      selectedItem = match;
      metaLine.textContent = `${match['Product Code'] || '—'} · ${match['Brand'] || '—'} · ${match['Category'] || '—'}`;
      metaLine.classList.add('show');
      if(!document.getElementById('fPrice').value && match['Standard Price / Kg']){
        const p = String(match['Standard Price / Kg']).replace(/[^0-9.]/g,'');
        if(p) document.getElementById('fPrice').value = p;
      }
    } else {
      selectedItem = null;
      metaLine.classList.remove('show');
    }
  });

  document.getElementById('fSupplier').addEventListener('change', function(){
    document.getElementById('newSupplierRow').style.display = (this.value === '__add_new__') ? 'flex' : 'none';
  });

  document.getElementById('confirmNewSupplierBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('fNewSupplier').value.trim();
    if(!name) return;
    const btn = document.getElementById('confirmNewSupplierBtn');
    btn.disabled = true; btn.textContent = 'Adding...';
    try{
      await fetch(`${API_URL}?action=addSupplier&name=${encodeURIComponent(name)}`);
      if(!suppliers.includes(name)) suppliers.push(name);
      populateSupplierDropdown();
      document.getElementById('fSupplier').value = name;
      document.getElementById('newSupplierRow').style.display = 'none';
      document.getElementById('fNewSupplier').value = '';
    }catch(e){ alert('Could not add supplier. Check your connection.'); }
    btn.disabled = false; btn.textContent = 'Add';
  });

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    renderHistory();
  });

  function renderHistory(){
    const list = entries
      .filter(e => e.Branch === currentBranch)
      .sort((a,b) => new Date(b['Receive Date']) - new Date(a['Receive Date']))
      .slice(0, 40);
    const el = document.getElementById('historyList');
    if(list.length === 0){
      el.innerHTML = '<div class="empty-note">No stock received yet for ' + currentBranch + '.</div>';
      return;
    }
    el.innerHTML = list.map(e => {
      const st = statusFor(e['Expiry Date']);
      return `
        <div class="hist-row">
          <div class="hist-top">
            <span>${e['Chocolate Name'] || '—'} <span style="color:var(--ink-dim); font-weight:400;">(${e.ID || '—'})</span></span>
            <span class="status-pill ${st.cls}">${st.label}</span>
          </div>
          <div class="hist-meta">${fmtDate(e['Receive Date'])} · ${e['Qty Received'] ?? e['Current Stock'] ?? 0} ${e.Unit || ''} · ${fmtBD(e['Price / Kg'])}/kg · Batch: ${e['Batch No.'] || '—'}</div>
          <div class="hist-meta">Supplier: ${e.Supplier || '—'} · Received by: ${e['Created By'] || '—'}</div>
          ${e.Remarks ? `<div class="hist-remarks">${e.Remarks}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  document.getElementById('logBtn').addEventListener('click', async ()=>{
    const chocolateName = document.getElementById('fSearch').value.trim();
    const receiveDate = document.getElementById('fDate').value;
    const deliveryNo = document.getElementById('fDeliveryNo').value.trim();
    const supplierSel = document.getElementById('fSupplier').value;
    const supplier = (supplierSel === '__add_new__') ? '' : supplierSel;
    const batchNo = document.getElementById('fBatchNo').value.trim();
    const expiryDate = document.getElementById('fExpiryDate').value;
    const qty = parseFloat(document.getElementById('fQty').value);
    const unit = document.getElementById('fUnit').value;
    const price = parseFloat(document.getElementById('fPrice').value);
    const storageLocation = document.getElementById('fStorageLocation').value;
    const trayCode = document.getElementById('fTrayCode').value.trim();
    const receivedBy = document.getElementById('fReceivedBy').value.trim();
    const remarks = document.getElementById('fRemarks').value.trim();

    if(!chocolateName || !receiveDate || !supplier || isNaN(qty) || qty <= 0){
      alert('Chocolate name, receive date, supplier, and a valid quantity are required.');
      return;
    }

    const logBtn = document.getElementById('logBtn');
    logBtn.disabled = true; logBtn.textContent = 'Logging...';

    const params = new URLSearchParams({
      action: 'addEntry',
      branch: currentBranch,
      chocolateName,
      receiveDate,
      deliveryNo,
      supplier,
      productCode: selectedItem ? (selectedItem['Product Code'] || '') : '',
      brand: selectedItem ? (selectedItem['Brand'] || '') : '',
      category: selectedItem ? (selectedItem['Category'] || '') : '',
      batchNo,
      expiryDate,
      qty,
      unit,
      price: isNaN(price) ? 0 : price,
      storageLocation,
      trayCode,
      receivedBy,
      remarks,
      weightPerPiece: selectedItem ? (selectedItem['Grams'] || '') : '',
      pricePerPiece: ''
    });

    try{
      const res = await fetch(`${API_URL}?${params.toString()}`);
      const data = await res.json();

      entries.push({
        ID: data.id, 'Receive Date': receiveDate, Supplier: supplier,
        'Chocolate Name': chocolateName, 'Batch No.': batchNo, 'Expiry Date': expiryDate,
        'Qty Received': qty, Unit: unit, 'Price / Kg': price, Branch: currentBranch,
        Remarks: remarks, 'Created By': receivedBy
      });

      if(receivedBy && !receivedByNames.includes(receivedBy)){
        receivedByNames.push(receivedBy);
        populateReceivedByList();
        fetch(`${API_URL}?action=addReceivedBy&name=${encodeURIComponent(receivedBy)}`).catch(()=>{});
      }

      document.getElementById('fSearch').value = '';
      document.getElementById('itemMetaLine').classList.remove('show');
      selectedItem = null;
      document.getElementById('fDeliveryNo').value = '';
      document.getElementById('fSupplier').value = '';
      document.getElementById('fBatchNo').value = '';
      document.getElementById('fExpiryDate').value = '';
      document.getElementById('fQty').value = '';
      document.getElementById('fPrice').value = '';
      document.getElementById('fTrayCode').value = '';
      document.getElementById('fRemarks').value = '';

      renderHistory();
    }catch(e){
      alert('Could not log this delivery. Check your connection and try again.');
    }
    logBtn.disabled = false; logBtn.textContent = 'Log Receiving';
  });

  document.getElementById('printBtn').addEventListener('click', ()=>{
    const list = entries
      .filter(e => e.Branch === currentBranch)
      .sort((a,b) => new Date(b['Receive Date']) - new Date(a['Receive Date']));
    document.getElementById('pMeta').textContent =
      `${currentBranch} · Printed on ${new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('pTableBody').innerHTML = list.map(e => {
      const st = statusFor(e['Expiry Date']);
      return `
        <tr>
          <td>${e.ID || '—'}</td>
          <td>${fmtDate(e['Receive Date'])}</td>
          <td>${e['Chocolate Name'] || '—'}</td>
          <td>${e['Batch No.'] || '—'}</td>
          <td>${e['Qty Received'] ?? '—'}</td>
          <td>${e.Unit || '—'}</td>
          <td>${fmtBD(e['Price / Kg'])}</td>
          <td>${fmtDate(e['Expiry Date'])}</td>
          <td>${st.label}</td>
          <td>${e['Created By'] || '—'}</td>
        </tr>
      `;
    }).join('');
    window.print();
  });

  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn');
    btn.textContent = 'Refreshing...';
    await loadData();
    btn.textContent = '↻ Refresh Data';
  });

  loadData();
</script>
</body>
</html>
