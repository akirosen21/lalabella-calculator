<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chocolate Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ede0;
    --paper-2:#e9e0c8;
    --ink:#1c2b45;
    --ink-dim:#5c6a83;
    --rust:#b0442e;
    --gold:#c68a1f;
    --line:#c9bfa0;
    --ok:#3d7a4f;
    --rose:#c9506b;
    --plum:#7a4c8a;
    --teal:#2f8a82;
    --amber:#d68f2e;
    --sky:#3d7ab0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(201,80,107,0.08), transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(122,76,138,0.08), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .petal-field{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .petal{
    position:absolute; top:-40px; opacity:0;
    animation-name: petalFall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    10%{ opacity:0.5; }
    90%{ opacity:0.4; }
    100%{ transform:translate(var(--drift,20px), 110vh) rotate(280deg); opacity:0; }
  }

  .music-toggle{
    position:fixed; top:14px; right:14px; z-index:50;
    background:#fff; border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; font-size:12px; cursor:pointer; color:var(--ink-dim);
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .music-toggle.playing{ color:var(--rose); border-color:var(--rose); }

  .wrap{ max-width:680px; margin:0 auto; padding:28px 18px 60px; position:relative; z-index:1; }

  @media (min-width: 900px){
    .wrap{ max-width:1200px; padding:36px 32px 70px; }
    header{ margin-bottom:32px; }
    .branch-tabs{ max-width:420px; }
    #dashboardContent{
      column-count:2; column-gap:20px;
    }
    #dashboardContent .card{
      break-inside:avoid; -webkit-column-break-inside:avoid;
    }
    .kpi-grid{ grid-template-columns:1fr 1fr 1fr 1fr; }
  }

  @media (min-width: 1300px){
    #dashboardContent{ column-count:3; }
  }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
  }
  .back-link:hover{ color:var(--rust); }

  header{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900;
    font-size:clamp(1.8rem,7vw,2.6rem); margin:0 0 6px; line-height:1;
  }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px;
    margin-bottom:20px; background:var(--paper-2); padding:5px; border-radius:3px;
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px;
    color:var(--ink-dim); cursor:pointer; border-radius:2px;
  }
  .branch-tab.active{ background:var(--ink); color:var(--paper); }

  .refresh-link{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer; margin-bottom:14px;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:20px; margin-bottom:18px;
  }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    margin:0 0 14px;
  }

  .kpi-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .kpi-cell{
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:12px; border-left:3px solid var(--line);
  }
  .kpi-cell.warn{ background:#fbf1de; border-color:var(--gold); border-left-color:var(--gold); }
  .kpi-cell.danger{ background:#f6e0e0; border-color:var(--rust); border-left-color:var(--rust); }
  .kpi-cell.c-rose{ border-left-color:var(--rose); }
  .kpi-cell.c-plum{ border-left-color:var(--plum); }
  .kpi-cell.c-teal{ border-left-color:var(--teal); }
  .kpi-cell.c-amber{ border-left-color:var(--amber); }
  .kpi-cell.c-sky{ border-left-color:var(--sky); }
  .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-dim); }
  .kpi-value{ font-family:'Space Mono',monospace; font-weight:700; font-size:18px; margin-top:4px; }

  .stat-row{ display:flex; justify-content:space-between; border-top:1px solid var(--line); padding:10px 0; font-size:13px; }
  .stat-row:first-child{ border-top:none; }
  .stat-row .val{ font-weight:600; }

  .branch-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .branch-table th{ text-align:left; padding:6px 4px; color:var(--ink-dim); font-weight:600; border-bottom:1px solid var(--line); font-size:10.5px; text-transform:uppercase; }
  .branch-table td{ padding:8px 4px; border-bottom:1px solid var(--paper-2); }
  .lock-badge{ font-size:9.5px; padding:2px 6px; border-radius:8px; font-weight:700; }
  .lock-yes{ background:#e3f0e6; color:var(--ok); }
  .lock-no{ background:#fbf1de; color:var(--gold); }

  .list-row{ border-top:1px solid var(--line); padding:10px 0; font-size:13px; display:flex; justify-content:space-between; }
  .list-row:first-child{ border-top:none; }
  .list-row-meta{ color:var(--ink-dim); font-size:11px; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:16px 0; }
  .badge-days{ font-size:10px; padding:2px 7px; border-radius:9px; font-weight:700; }
  .badge-expired{ background:#f6e0e0; color:var(--rust); }
  .badge-near{ background:#fbf1de; color:var(--gold); }

  .loading{ text-align:center; padding:40px 0; color:var(--ink-dim); }

  .cat-breakdown-row{ border-top:1px solid var(--line); }
  .cat-breakdown-row:first-child{ border-top:none; }
  .cat-breakdown-toggle{
    width:100%; background:none; border:none; padding:12px 0; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; color:var(--ink);
  }
  .cat-breakdown-count{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12px;
    color:var(--gold); background:var(--paper); padding:2px 8px; border-radius:10px;
  }
  .cat-breakdown-count.complete{ color:var(--ok); background:#e3f0e6; }
  .cat-breakdown-detail{ padding:0 0 12px 0; }
  .cat-item-line{ font-size:12px; padding:3px 0; }
  .cat-item-line.available{ color:var(--ok); }
  .cat-item-line.missing{ color:var(--ink-dim); }
</style>
</head>
<body>
<div class="petal-field" id="petalField"></div>
<button class="music-toggle" id="musicToggle">🎵 Music</button>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Chocolate Dashboard</h1>
    <p class="sub">Live overview across all branches</p>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="All">All</button>
    <button class="branch-tab" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>

  <button class="refresh-link" id="refreshBtn">↻ Refresh Data</button>
  <div id="lastRefreshedNote" style="font-size:10.5px; color:var(--ink-dim); margin:-10px 0 14px;"></div>

  <div id="dashboardContent">
    <div class="loading">Loading dashboard...</div>
  </div>
</div>

<script>
  /* ---------- Falling chocolate + rose petals ---------- */
  const PETAL_EMOJI = ['🌹','🍫','🌹','🍫','🌸'];
  function spawnPetal(){
    const field = document.getElementById('petalField');
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = PETAL_EMOJI[Math.floor(Math.random()*PETAL_EMOJI.length)];
    const left = Math.random() * 100;
    const duration = 13 + Math.random() * 10;
    const drift = (Math.random() * 90 - 45) + 'px';
    p.style.left = left + 'vw';
    p.style.fontSize = (15 + Math.random()*12) + 'px';
    p.style.setProperty('--drift', drift);
    p.style.animationDuration = duration + 's';
    field.appendChild(p);
    setTimeout(()=> p.remove(), duration*1000 + 200);
  }
  for(let i=0;i<6;i++){ setTimeout(spawnPetal, i * 900); }
  setInterval(spawnPetal, 2400);

  /* ---------- Ambient "river-flowing" piano (original composition, generated) ---------- */
  let musicCtx = null;
  let musicPlaying = false;
  let loopTimer = null;
  const RIVER_LOOP_SECONDS = 12;
  const RIVER_PATTERN = [
    { note: 587.33, t: 0.0,  dur: 1.2, vol: 0.045 },
    { note: 698.46, t: 0.6,  dur: 1.2, vol: 0.04  },
    { note: 880.00, t: 1.2,  dur: 1.4, vol: 0.045 },
    { note: 987.77, t: 2.0,  dur: 1.2, vol: 0.04  },
    { note: 880.00, t: 2.8,  dur: 1.6, vol: 0.04  },
    { note: 698.46, t: 3.8,  dur: 1.4, vol: 0.038 },
    { note: 587.33, t: 4.8,  dur: 1.8, vol: 0.04  },
    { note: 523.25, t: 6.0,  dur: 1.2, vol: 0.038 },
    { note: 659.25, t: 6.6,  dur: 1.2, vol: 0.04  },
    { note: 783.99, t: 7.2,  dur: 1.4, vol: 0.042 },
    { note: 880.00, t: 8.0,  dur: 1.4, vol: 0.04  },
    { note: 698.46, t: 9.0,  dur: 1.6, vol: 0.038 },
    { note: 587.33, t: 10.0, dur: 2.0, vol: 0.035 },
  ];
  function pianoNote(freq, startTime, dur, vol){
    const ctx = musicCtx;
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.type = 'sine'; osc2.type = 'triangle';
    osc1.frequency.value = freq; osc2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.15;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc1.connect(gain); osc2.connect(g2).connect(gain); gain.connect(ctx.destination);
    osc1.start(startTime); osc1.stop(startTime + dur + 0.05);
    osc2.start(startTime); osc2.stop(startTime + dur + 0.05);
  }
  function scheduleLoop(loopStart){
    if(!musicPlaying) return;
    RIVER_PATTERN.forEach(n=> pianoNote(n.note, loopStart + n.t, n.dur, n.vol));
    loopTimer = setTimeout(()=> scheduleLoop(musicCtx.currentTime), RIVER_LOOP_SECONDS * 1000);
  }
  function startMusic(){
    if(!musicCtx) musicCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicPlaying = true;
    document.getElementById('musicToggle').classList.add('playing');
    document.getElementById('musicToggle').textContent = '🎵 Playing';
    scheduleLoop(musicCtx.currentTime + 0.1);
  }
  function stopMusic(){
    musicPlaying = false;
    document.getElementById('musicToggle').classList.remove('playing');
    document.getElementById('musicToggle').textContent = '🎵 Music';
    if(loopTimer) clearTimeout(loopTimer);
  }
  document.getElementById('musicToggle').addEventListener('click', ()=>{
    if(musicPlaying) stopMusic(); else startMusic();
  });

  const API_URL = 'https://script.google.com/macros/s/AKfycbznLqWonLj9K1NR0kb3KfzZcSTxbxCMEJJS9CQFYd6GYcGPv9Alwk2dO4mpjwxGVg/exec';
  let currentBranch = 'All';
  let data = null;

  function fmtBD(n){
    return Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' BD';
  }
  function fmtNum(n){
    return Number(n || 0).toLocaleString('en-US');
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  async function loadData(){
    document.getElementById('dashboardContent').innerHTML = '<div class="loading">Loading dashboard...</div>';
    try{
      const t = Date.now();
      data = await (await fetch(API_URL + '?action=getDashboardData&branch=' + currentBranch + '&_ts=' + t)).json();
      render();
      updateLastRefreshed();
    }catch(e){
      document.getElementById('dashboardContent').innerHTML = '<div class="loading">Could not load dashboard data.</div>';
      console.error(e);
    }
  }

  async function silentRefresh(){
    try{
      const t = Date.now();
      const fresh = await (await fetch(API_URL + '?action=getDashboardData&branch=' + currentBranch + '&_ts=' + t)).json();
      data = fresh;
      render();
      updateLastRefreshed();
    }catch(e){ /* stay quiet on background refresh failures */ }
  }

  function updateLastRefreshed(){
    const el = document.getElementById('lastRefreshedNote');
    if(el) el.textContent = 'Auto-updating · last refreshed ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  setInterval(silentRefresh, 30000);

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    loadData();
  });

  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn');
    btn.textContent = 'Refreshing...';
    await loadData();
    btn.textContent = '↻ Refresh Data';
  });

  function render(){
    if(!data) return;
    const el = document.getElementById('dashboardContent');

    const expiredClass = data.expiredCount > 0 ? 'danger' : (data.nearExpiryCount > 0 ? 'warn' : '');

    let html = `
      <div class="card">
        <div class="card-title">Today at a Glance</div>
        <div class="kpi-grid">
          <div class="kpi-cell c-rose">
            <div class="kpi-label">Total Stock Quantity</div>
            <div class="kpi-value">${fmtNum(data.totalAvailable)}</div>
          </div>
          <div class="kpi-cell c-plum">
            <div class="kpi-label">Inventory Value</div>
            <div class="kpi-value">${fmtBD(data.totalValue)}</div>
          </div>
          <div class="kpi-cell c-teal">
            <div class="kpi-label">Today's Receiving</div>
            <div class="kpi-value">${fmtBD(data.todayReceiving)}</div>
          </div>
          <div class="kpi-cell c-sky">
            <div class="kpi-label">Today's Releases</div>
            <div class="kpi-value">${fmtBD(data.todayReleases)}</div>
          </div>
          <div class="kpi-cell c-amber">
            <div class="kpi-label">Today's Transfers</div>
            <div class="kpi-value">${fmtNum(data.todayTransfers)}</div>
          </div>
          <div class="kpi-cell ${data.pendingApprovalsCount > 0 ? 'warn' : 'c-plum'}">
            <div class="kpi-label">Pending Approvals</div>
            <div class="kpi-value">${fmtNum(data.pendingApprovalsCount)}</div>
          </div>
          <div class="kpi-cell ${expiredClass || 'c-rose'}">
            <div class="kpi-label">Near Expiry / Expired</div>
            <div class="kpi-value">${fmtNum(data.nearExpiryCount)} / ${fmtNum(data.expiredCount)}</div>
          </div>
          <div class="kpi-cell ${data.lowStockCount > 0 ? 'warn' : 'c-teal'}">
            <div class="kpi-label">Low Stock Items</div>
            <div class="kpi-value">${fmtNum(data.lowStockCount)}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Chocolate Variants Available <span style="color:var(--ink-dim); font-family:'Space Mono',monospace; font-size:14px;">(${fmtNum(data.distinctVariantsAvailable)})</span></div>
        <div id="categoryBreakdownList">
          ${renderCategoryBreakdown(data.categoryBreakdown)}
        </div>
      </div>

      <div class="card">
        <div class="card-title">This Week</div>
        <div class="stat-row"><span>Received This Week</span><span class="val">${fmtBD(data.weekReceiving)}</span></div>
        <div class="stat-row"><span>Released This Week</span><span class="val">${fmtBD(data.weekReleases)}</span></div>
        <div class="stat-row"><span>Transferred This Week</span><span class="val">${fmtNum(data.weekTransfers)}</span></div>
      </div>

      <div class="card">
        <div class="card-title">Last Activity</div>
        ${lastActivityRow('Last Receiving', data.lastReceiving)}
        ${lastActivityRow('Last Release', data.lastRelease)}
        ${lastActivityRow('Last Transfer', data.lastTransfer)}
      </div>
    `;

    if(currentBranch === 'All'){
      html += `
        <div class="card">
          <div class="card-title">Branch Summary</div>
          <table class="branch-table">
            <thead>
              <tr><th>Branch</th><th>Available</th><th>Value</th><th>Low</th><th>Near/Exp</th><th>Setup</th></tr>
            </thead>
            <tbody>
              ${data.branchSummary.map(b => `
                <tr>
                  <td><strong>${b.branch}</strong></td>
                  <td>${fmtNum(b.available)}</td>
                  <td>${fmtBD(b.value)}</td>
                  <td>${b.lowStock}</td>
                  <td>${b.nearExpiry}/${b.expired}</td>
                  <td><span class="lock-badge ${b.locked ? 'lock-yes' : 'lock-no'}">${b.locked ? 'Locked' : 'Open'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    html += `
      <div class="card">
        <div class="card-title">Low Stock</div>
        ${renderList(data.lowStockList, item => `
          <div class="list-row">
            <div><strong>${item.name}</strong><div class="list-row-meta">${item.branch}</div></div>
            <div style="text-align:right;">${item.available} / ${item.min}<div class="list-row-meta">need ${item.deficit} more</div></div>
          </div>
        `, 'No low stock items right now.')}
      </div>

      <div class="card">
        <div class="card-title">Expired</div>
        ${renderList(data.expiredList, item => `
          <div class="list-row">
            <div><strong>${item.name}</strong><div class="list-row-meta">${item.branch}</div></div>
            <div style="text-align:right;"><span class="badge-days badge-expired">${Math.abs(item.daysLeft)}d ago</span><div class="list-row-meta">${fmtDate(item.expiryDate)}</div></div>
          </div>
        `, 'No expired items.')}
      </div>

      <div class="card">
        <div class="card-title">Near Expiry</div>
        ${renderList(data.nearExpiryList, item => `
          <div class="list-row">
            <div><strong>${item.name}</strong><div class="list-row-meta">${item.branch}</div></div>
            <div style="text-align:right;"><span class="badge-days badge-near">${item.daysLeft}d left</span><div class="list-row-meta">${fmtDate(item.expiryDate)}</div></div>
          </div>
        `, 'No items nearing expiry.')}
      </div>

      <div class="card">
        <div class="card-title">Top Moving Items</div>
        ${renderList(data.topMovingList, (item, i) => `
          <div class="list-row">
            <div><strong>${i+1}. ${item.name}</strong></div>
            <div>${fmtNum(item.used)} used</div>
          </div>
        `, 'No movement data yet.')}
      </div>

      <div class="card">
        <div class="card-title">Recent Transfers</div>
        ${renderList(data.recentTransfers, item => `
          <div class="list-row">
            <div><strong>${item.chocolateName}</strong><div class="list-row-meta">${item.fromBranch} → ${item.toBranch}</div></div>
            <div style="text-align:right;">${item.qty}<div class="list-row-meta">${fmtDate(item.date)}</div></div>
          </div>
        `, 'No transfers yet.')}
      </div>
    `;

    el.innerHTML = html;
  }

  function lastActivityRow(label, info){
    if(!info){
      return `<div class="stat-row"><span>${label}</span><span class="val" style="color:var(--ink-dim);">No activity yet</span></div>`;
    }
    return `<div class="stat-row"><span>${label}</span><span class="val">${info.chocolateName || '—'} · ${fmtDate(info.date)}</span></div>`;
  }

  function renderList(list, rowFn, emptyText){
    if(!list || list.length === 0){
      return `<div class="empty-note">${emptyText}</div>`;
    }
    return list.map(rowFn).join('');
  }

  function renderCategoryBreakdown(list){
    if(!list || list.length === 0){
      return '<div class="empty-note">No category data yet.</div>';
    }
    return list.map((cat, i) => {
      const complete = cat.availableCount === cat.totalInCatalog;
      return `
        <div class="cat-breakdown-row">
          <button class="cat-breakdown-toggle" data-idx="${i}">
            <span>${cat.category}</span>
            <span class="cat-breakdown-count ${complete ? 'complete' : ''}">${cat.availableCount} / ${cat.totalInCatalog}</span>
          </button>
          <div class="cat-breakdown-detail" id="catDetail${i}" style="display:none;">
            ${cat.availableItems.map(n => `<div class="cat-item-line available">✓ ${n}</div>`).join('')}
            ${cat.missingItems.map(n => `<div class="cat-item-line missing">— ${n}</div>`).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  document.addEventListener('click', e=>{
    const btn = e.target.closest('.cat-breakdown-toggle');
    if(!btn) return;
    const detail = document.getElementById('catDetail' + btn.dataset.idx);
    if(detail) detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
  });

  loadData();
</script>
</body>
</html>
