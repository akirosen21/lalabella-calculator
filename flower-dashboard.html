<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flower Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0;
    --blush-2:#f6e0da;
    --mint:#eaf3ec;
    --rose:#c9506b;
    --rose-deep:#9e2f4a;
    --gold:#d9a441;
    --leaf:#5f8f63;
    --ink:#3a2530;
    --ink-dim:#8a7078;
    --line:#f0d9d9;
    --ok:#3d7a4f;
    --warn:#c68a1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 18%, rgba(255,190,210,.22), transparent 22%),
      radial-gradient(circle at 92% 28%, rgba(255,225,130,.20), transparent 22%),
      radial-gradient(circle at 18% 82%, rgba(190,145,255,.16), transparent 24%),
      radial-gradient(circle at 82% 88%, rgba(255,170,190,.18), transparent 24%),
      linear-gradient(145deg, #dcefd5 0%, #b9dfb5 48%, #e6f1c9 100%);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:26px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
  }
  .back-link:hover{ color:var(--rose-deep); }

  header{
    text-align:center; margin-bottom:22px; padding:24px 18px;
    background:linear-gradient(135deg, #fff 0%, var(--blush) 60%, var(--blush-2) 100%);
    border-radius:18px; border:1px solid var(--line);
    box-shadow:0 8px 26px rgba(158,47,74,0.08);
    position:relative; overflow:hidden;
  }
  header::before{
    content:'🌹'; position:absolute; font-size:64px; opacity:0.08;
    left:-12px; top:-16px; transform:rotate(-16deg);
  }
  header::after{
    content:'🌷'; position:absolute; font-size:56px; opacity:0.09;
    right:-8px; bottom:-14px; transform:rotate(14deg);
  }
  .eyebrow{
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold);
    margin-bottom:6px; font-weight:600; position:relative; z-index:1;
  }
  h1{
    font-family:'Great Vibes', cursive; font-weight:400; color:var(--rose-deep);
    font-size:clamp(2.1rem,8vw,2.8rem); margin:0; line-height:1;
    position:relative; z-index:1;
  }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px;
    margin-bottom:18px; background:#fff; padding:5px; border-radius:14px;
    border:1px solid var(--line);
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px;
    color:var(--ink-dim); cursor:pointer; border-radius:10px; transition:all .2s ease;
  }
  .branch-tab.active{
    background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff;
    box-shadow:0 3px 10px rgba(158,47,74,0.25);
  }

  .refresh-link{
    background:#fff; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:9px 16px; border-radius:20px; cursor:pointer; margin-bottom:14px;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-bottom:18px; box-shadow:0 4px 16px rgba(158,47,74,0.05);
  }
  .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  .gear-btn{
    margin-left:auto; background:none; border:1px solid var(--line); color:var(--ink-dim);
    width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .gear-btn:hover{ color:var(--rose-deep); border-color:var(--rose); }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(58,37,48,0.5);
    align-items:center; justify-content:center; z-index:80; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:16px; padding:24px; width:100%; max-width:360px; }
  .modal h3{ font-family:'Fraunces',serif; margin:0 0 16px; }
  .modal label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-dim); margin-bottom:5px; margin-top:12px; }
  .modal label:first-of-type{ margin-top:0; }
  .modal input{ width:100%; background:var(--blush); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--ink); outline:none; }
  .modal .submit-btn{ width:100%; margin-top:18px; padding:12px 0; background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff; border:none; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; }
  .modal .modal-close{ width:100%; margin-top:8px; padding:10px 0; background:none; border:none; color:var(--ink-dim); font-size:12px; cursor:pointer; }

  .card.provisional{ border-color:var(--warn); background:linear-gradient(160deg,#fbf1de,#fff); }
  .provisional-note{
    font-size:11.5px; color:var(--warn); background:#fdf6e8; border:1px dashed var(--warn);
    border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.5;
  }

  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi-cell{
    background:var(--blush); border:1px solid var(--line); border-radius:12px;
    padding:12px; border-left:4px solid var(--rose);
  }
  .kpi-cell.leaf{ border-left-color:var(--leaf); }
  .kpi-cell.gold{ border-left-color:var(--gold); }
  .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-dim); }
  .kpi-value{ font-family:'Space Mono',monospace; font-weight:700; font-size:18px; margin-top:5px; }

  .budget-bar{ height:8px; background:var(--blush-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .budget-fill{ height:100%; background:var(--leaf); transition:width .3s ease; }
  .budget-fill.over{ background:var(--rose); }
  .budget-text{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:6px; }

  .hist-row{ border-top:1px solid var(--blush-2); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-name{ font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:16px 0; }
  .loading{ text-align:center; padding:20px 0; color:var(--ink-dim); font-size:13px; }

  @media (min-width: 900px){
    .wrap{ max-width:1080px; padding:34px 30px 70px; }
    .branch-tabs{ max-width:480px; }
    .layout{ display:flex; gap:18px; align-items:flex-start; }
    .col-main{ flex:1.3; display:flex; flex-direction:column; gap:18px; }
    .col-side{ flex:1; display:flex; flex-direction:column; gap:18px; position:sticky; top:24px; }
  }


  /* Simple header refresh button - replaces the old floating balloon */
  .refresh-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); color:var(--rose-deep);
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:9px 16px; border-radius:20px; cursor:pointer; margin-bottom:14px;
  }
  .refresh-btn:hover{ border-color:var(--rose); }
  .refresh-btn.busy{ opacity:0.6; pointer-events:none; }
  .refresh-btn .icon{ display:inline-block; transition:transform .5s ease; }
  .refresh-btn.busy .icon{ animation:spin 0.7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .dash-tools{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .dash-tool{background:#fff;border:1px solid var(--line);color:var(--ink-dim);font-size:11px;padding:8px 13px;border-radius:20px;cursor:pointer}
  .dash-tool:hover{color:var(--rose-deep);border-color:var(--rose)}
  .music-on{background:var(--blush);color:var(--rose-deep);border-color:var(--rose)}
  .music-panel{
    display:none; position:fixed; top:64px; right:16px; z-index:80;
    width:min(320px,calc(100vw - 32px)); background:#fff; border:1px solid var(--line);
    border-radius:16px; padding:16px; box-shadow:0 20px 50px rgba(90,40,55,.2);
  }
  .music-panel.show{ display:block; }
  .music-panel label{ display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .music-panel input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--blush); color:var(--ink); font-family:'Space Grotesk',sans-serif; font-size:12px; outline:none;
  }
  .music-panel .hint{ font-size:10px; color:var(--ink-dim); margin-top:8px; line-height:1.5; }
  .music-panel .apply-btn{
    margin-top:10px; width:100%; padding:9px 0; background:linear-gradient(135deg, var(--gold), #c8873a);
    color:#241608; border:none; border-radius:10px; font-weight:700; font-size:11px; cursor:pointer;
  }
  .music-now{ font-size:10px; color:var(--ink-dim); margin-top:10px; padding-top:10px; border-top:1px solid var(--blush-2); word-break:break-all; }


  .garden-side{
    position:fixed; z-index:1; pointer-events:none; opacity:.82;
    font-size:34px; line-height:1; filter:drop-shadow(0 4px 5px rgba(45,90,50,.12));
  }
  .garden-left{left:4px;top:18%}
  .garden-right{right:4px;bottom:16%}
  .garden-top{right:9%;top:7%;font-size:25px}
  .garden-side span{display:block;margin:10px 0}
  .garden-vine{
    position:fixed;z-index:1;pointer-events:none;color:rgba(45,110,55,.5);
    font-size:46px;line-height:.7;
  }
  .vine-left{left:-8px;bottom:4%}
  .vine-right{right:-8px;top:38%}
  @media(max-width:600px){
    .garden-side{font-size:24px;opacity:.55}
    .garden-left{left:-4px;top:22%}
    .garden-right{right:-4px;bottom:20%}
    .garden-top{right:7%;top:10%;font-size:20px}
    .garden-vine{font-size:32px;opacity:.35}
  }

</style>
</head>
<body>
<div class="garden-side garden-left" aria-hidden="true"><span>🌷</span><span>🌼</span><span>🌸</span></div>
<div class="garden-side garden-right" aria-hidden="true"><span>🌺</span><span>🌻</span><span>🌷</span></div>
<div class="garden-side garden-top" aria-hidden="true">🌸 🦋 🌼</div>
<div class="garden-vine vine-left" aria-hidden="true">🌿<br>🌱<br>🌿</div>
<div class="garden-vine vine-right" aria-hidden="true">🌿<br>🌱<br>🌿</div>
<div class="wrap">
  <a class="back-link" href="flower-tools.html">&larr; Flower Tools</a>
  <a class="back-link" href="flower-receiving.html" style="float:right;">📦 Receiving &rarr;</a>
  <a class="back-link" href="flower-stock-count.html" style="float:right; margin-right:14px;">📋 Stock Count</a>
  <header>
    <div class="eyebrow">Lalabella Flowers</div>
    <h1>Flower Dashboard</h1>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="All">All</button>
    <button class="branch-tab" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>
  <div class="dash-tools">
    <button class="dash-tool" id="soundBtn" type="button">♫ Music</button>
    <button class="refresh-btn" id="refreshBtn" type="button"><span class="icon">↻</span> Refresh</button>
  </div>
  <div class="music-panel" id="musicPanel">
    <label>Sound URL — YouTube link or direct mp3</label>
    <input type="text" id="musicUrlInput" placeholder="Paste a YouTube link or an mp3 URL" />
    <div class="hint">Paste a YouTube video link (easiest), or a direct mp3 link you own the rights to.</div>
    <button class="apply-btn" id="musicApplyBtn">Play This Sound</button>
    <div class="music-now" id="musicNow">No sound loaded yet.</div>
  </div>
  <audio id="audioPlayer" loop></audio>
  <div id="ytPlayerWrap" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;"></div>

  <div id="dashboardContent"><div class="loading">Loading…</div></div>
</div>

<div class="modal-overlay" id="budgetModalOverlay">
  <div class="modal">
    <h3>Set Weekly Budget</h3>
    <label>ModaMall (BD)</label>
    <input type="number" id="budgetModaMall" min="0" step="0.001" />
    <label>Hamala (BD)</label>
    <input type="number" id="budgetHamala" min="0" step="0.001" />
    <label>Galali (BD)</label>
    <input type="number" id="budgetGalali" min="0" step="0.001" />
    <button class="submit-btn" id="saveBudgetBtn">Save</button>
    <button class="modal-close" id="closeBudgetModalBtn">Close</button>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzC-h3iV0AJU0A3mKhj_0V5-yOeLoJYlupFlPnKHelbyhcSiqUbK6LTjgo4qZF03Bs/exec';
  let currentBranch = 'All';
  let data = null;

  function fmtBD(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD'; }
  function fmtNum(n){ return Number(n||0).toLocaleString('en-US'); }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  function renderRecentReceiving(list){
    if(!list || list.length === 0){
      return '<div class="empty-note">No flower receiving logged yet.</div>';
    }
    return list.map(e => `
      <div class="hist-row">
        <div style="font-weight:600;">${e.Flower || '—'} <span style="color:var(--ink-dim); font-weight:400;">(${e.Origin || 'N/A'})</span></div>
        <div class="hist-meta" style="color:var(--ink-dim); font-size:11.5px; margin-top:3px;">${fmtDate(e.Date)} · ${e.Branch || ''} · Qty ${e.Qty} ${e.Unit || ''} · ${fmtBD(e.Subtotal)}</div>
        <div class="hist-meta" style="color:var(--ink-dim); font-size:11.5px;">Supplier: ${e.Supplier || '—'} · Received by: ${e['Received By'] || '—'}</div>
      </div>
    `).join('');
  }

  function render(){
    if(!data) return;
    const el = document.getElementById('dashboardContent');
    const budget = data.weeklyBudget || {};
    const pct = Math.min(100, budget.percentUsed || 0);
    const over = (budget.actual || 0) > (budget.weeklyLimit || 0);

    el.innerHTML = `
      <div class="layout">
        <div class="col-main">

          <div class="card">
            <div class="card-title">📅 This Week</div>
            <div class="kpi-grid">
              <div class="kpi-cell">
                <div class="kpi-label">Today's Purchases</div>
                <div class="kpi-value">${fmtBD(data.todayPurchases)}</div>
              </div>
              <div class="kpi-cell leaf">
                <div class="kpi-label">This Week's Purchases</div>
                <div class="kpi-value">${fmtBD(data.weekPurchases)}</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">🌿 Weekly Budget <button class="gear-btn" id="gearBtn" title="Set weekly budget">⚙</button></div>
            <div class="budget-text"><span>${fmtBD(budget.actual)} of ${fmtBD(budget.weeklyLimit)}</span><span>${budget.percentUsed||0}%</span></div>
            <div class="budget-bar"><div class="budget-fill ${over?'over':''}" style="width:${pct}%"></div></div>
            <div class="budget-text"><span>Remaining</span><span>${fmtBD(budget.remaining)}</span></div>
          </div>

          <div class="card provisional">
            <div class="card-title">⚠️ Provisional Inventory</div>
            <div class="provisional-note">Cumulative receiving figures only — not actual Available Stock because Stock Count is not yet connected.</div>
            <div class="kpi-grid">
              <div class="kpi-cell gold">
                <div class="kpi-label">Cumulative Received</div>
                <div class="kpi-value">${fmtNum(data.cumulativeReceivedQty)}</div>
              </div>
              <div class="kpi-cell gold">
                <div class="kpi-label">Estimated Company Value</div>
                <div class="kpi-value">${fmtBD(data.estimatedCompanyValue)}</div>
              </div>
            </div>
          </div>

        </div>

        <div class="col-side">

          <div class="card">
            <div class="card-title">🌸 Flower Catalog</div>
            <div class="kpi-cell">
              <div class="kpi-label">Distinct Flower Names</div>
              <div class="kpi-value">${fmtNum(data.distinctFlowerCount)}</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">⏳ Rate Approvals</div>
            <div class="kpi-cell ${data.pendingApprovalsCount > 0 ? 'gold' : 'leaf'}">
              <div class="kpi-label">Pending Approval</div>
              <div class="kpi-value">${fmtNum(data.pendingApprovalsCount)}</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">📋 Recent Receiving</div>
            <div id="recentReceivingList">
              ${renderRecentReceiving(data.recentReceiving)}
            </div>
          </div>

        </div>
      </div>
    `;
  }

  async function loadData(){
    document.getElementById('dashboardContent').innerHTML = '<div class="loading">Loading…</div>';
    try{
      const t = Date.now();
      data = await (await fetch(API_URL + '?action=getFlowerDashboard&branch=' + currentBranch + '&_ts=' + t)).json();
      render();
    }catch(e){
      document.getElementById('dashboardContent').innerHTML = '<div class="loading">Could not load dashboard data.</div>';
      console.error(e);
    }
  }

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    loadData();
  });


  /* Manual refresh only — no automatic refresh, no drag/pull gesture */
  let refreshBusy = false;

  function playRefreshChime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [659.25, 880.00];
      notes.forEach((freq, i)=>{
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        const start = ctx.currentTime + i * 0.08;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(0.05, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        o.connect(g).connect(ctx.destination);
        o.start(start); o.stop(start + 0.35);
      });
    }catch(_){}
  }

  async function manualRefresh(sourceBtn){
    if(refreshBusy) return;
    refreshBusy = true;
    sourceBtn.classList.add('busy');
    playRefreshChime();
    try { await loadData(); }
    finally {
      sourceBtn.classList.remove('busy');
      refreshBusy = false;
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', ()=>{
    manualRefresh(document.getElementById('refreshBtn'));
  });

  /* Music panel:
     - Tap Music -> show URL box
     - Play Music -> hide panel and show Playing
     - Tap Playing -> pause
     - Double-click Playing -> reopen URL editor
     Shares the exact same implementation and localStorage keys as
     index.html, so a sound chosen there also plays here. */
  const audio = document.getElementById('audioPlayer');
  const soundBtn = document.getElementById('soundBtn');
  const musicPanel = document.getElementById('musicPanel');
  let isPlaying = false;
  let ytVideoId = null;

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function playYouTube(id){
    document.getElementById('ytPlayerWrap').innerHTML =
      `<iframe width="200" height="150" src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
  }
  function stopYouTube(){ document.getElementById('ytPlayerWrap').innerHTML = ''; }

  function saveSoundChoice(url, isYouTube){
    try{
      localStorage.setItem('lalabellaSoundUrl', url);
      localStorage.setItem('lalabellaSoundIsYouTube', isYouTube ? '1' : '0');
    }catch(e){}
  }

  function loadSavedSound(){
    try{
      const savedUrl = localStorage.getItem('lalabellaSoundUrl');
      const savedIsYT = localStorage.getItem('lalabellaSoundIsYouTube') === '1';
      if(!savedUrl) return;
      if(savedIsYT){
        ytVideoId = extractYouTubeId(savedUrl);
        document.getElementById('musicNow').textContent = 'Saved: YouTube track (tap ♫ to play)';
      } else {
        audio.src = savedUrl;
        document.getElementById('musicNow').textContent = 'Saved: ' + (savedUrl.length > 46 ? savedUrl.slice(0,46) + '…' : savedUrl);
      }
      document.getElementById('musicUrlInput').value = savedUrl;
      soundBtn.textContent = '♫ Music';
      isPlaying = false;
    }catch(e){}
  }
  loadSavedSound();

  soundBtn.addEventListener('click', ()=>{
    if(!audio.src && !ytVideoId){
      musicPanel.classList.toggle('show');
      return;
    }
    if(isPlaying){
      if(ytVideoId) stopYouTube(); else audio.pause();
      soundBtn.textContent = '♫ Music';
      isPlaying = false;
    } else {
      if(ytVideoId) playYouTube(ytVideoId); else audio.play().catch(()=>{});
      soundBtn.textContent = '♫ Playing';
      isPlaying = true;
    }
  });

  soundBtn.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    musicPanel.classList.toggle('show');
  });

  document.getElementById('musicApplyBtn').addEventListener('click', ()=>{
    const url = document.getElementById('musicUrlInput').value.trim();
    if(!url){ alert('Paste a sound URL first.'); return; }

    const id = extractYouTubeId(url);
    if(id){
      ytVideoId = id;
      audio.pause(); audio.removeAttribute('src');
      playYouTube(id);
      document.getElementById('musicNow').textContent = 'Now playing YouTube track';
      isPlaying = true;
      soundBtn.textContent = '♫ Playing';
      musicPanel.classList.remove('show');
      saveSoundChoice(url, true);
      return;
    }

    ytVideoId = null;
    stopYouTube();
    audio.src = url;
    document.getElementById('musicNow').textContent = 'Now loaded: ' + (url.length > 46 ? url.slice(0,46) + '…' : url);
    saveSoundChoice(url, false);
    audio.play().then(()=>{
      isPlaying = true;
      soundBtn.textContent = '♫ Playing';
      musicPanel.classList.remove('show');
    }).catch(()=>{
      soundBtn.textContent = '♫ Tap to Play';
    });
  });

  document.addEventListener('click', (e)=>{
    if(musicPanel.classList.contains('show') && !musicPanel.contains(e.target) && e.target !== soundBtn){
      musicPanel.classList.remove('show');
    }
  });

  /* Weekly Budget edit modal — gear button lives inside the re-rendered
     card, so we use event delegation on the document instead of binding
     directly (a direct bind would be lost every time render() runs). */
  const budgetModalOverlay = document.getElementById('budgetModalOverlay');

  document.addEventListener('click', (e)=>{
    if(e.target.closest('#gearBtn')){
      const bud = (data && data.weeklyBudget) ? data.weeklyBudget : {};
      // Pre-fill with the CURRENTLY selected branch's own value when a
      // single branch is active; when viewing "All", the three fields
      // stay blank so you don't accidentally overwrite one branch's
      // budget with the combined "All" total.
      if(currentBranch !== 'All'){
        document.getElementById('budget' + currentBranch).value = bud.weeklyLimit || '';
      }
      budgetModalOverlay.classList.add('show');
    }
  });

  document.getElementById('closeBudgetModalBtn').addEventListener('click', ()=>{
    budgetModalOverlay.classList.remove('show');
  });

  document.getElementById('saveBudgetBtn').addEventListener('click', async ()=>{
    const saveBtn = document.getElementById('saveBudgetBtn');
    const branches = ['ModaMall', 'Hamala', 'Galali'];
    const toSave = branches.filter(b => document.getElementById('budget' + b).value !== '');

    if(toSave.length === 0){
      alert('Maglagay ng halaga sa kahit isang branch.');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try{
      for(const b of toSave){
        const val = parseFloat(document.getElementById('budget' + b).value) || 0;
        await fetch(API_URL + '?action=setWeeklyBudget&branch=' + b + '&value=' + val);
      }
    }catch(e){
      alert('Hindi na-save. I-check ang connection mo.');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
    budgetModalOverlay.classList.remove('show');
    document.getElementById('budgetModaMall').value = '';
    document.getElementById('budgetHamala').value = '';
    document.getElementById('budgetGalali').value = '';
    await loadData();
  });

  loadData();
</script>
</body>
</html>
