<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chocolate Barcode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{
    --paper:#f3ede0;
    --paper-2:#e9e0c8;
    --ink:#1c2b45;
    --ink-dim:#5c6a83;
    --rust:#b0442e;
    --gold:#c68a1f;
    --line:#c9bfa0;
    --ok:#3d7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
  }
  .back-link:hover{ color:var(--rust); }

  header{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900;
    font-size:clamp(1.8rem,7vw,2.6rem); margin:0 0 6px; line-height:1;
  }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .tabs{
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
    margin-bottom:20px; background:var(--paper-2); padding:5px; border-radius:3px;
  }
  .tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-dim); cursor:pointer; border-radius:2px;
  }
  .tab.active{ background:var(--ink); color:var(--paper); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:20px; margin-bottom:18px;
  }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    margin:0 0 14px;
  }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-dim); margin-bottom:5px; margin-top:14px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=number]{
    width:100%; background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:14px;
    color:var(--ink); outline:none;
  }
  input[type=text]{ text-transform:uppercase; }
  input:focus{ border-color:var(--ink); }

  .category-pills{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none;
  }
  .category-pills::-webkit-scrollbar{ display:none; }
  .cat-pill{
    flex-shrink:0; background:var(--paper); border:1px solid var(--line); color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif; font-size:11.5px; padding:7px 12px;
    border-radius:16px; cursor:pointer; white-space:nowrap; transition:all .12s ease;
  }
  .cat-pill:hover{ border-color:var(--ink); color:var(--ink); }
  .cat-pill.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600; }

  .qty-presets{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .preset-btn{
    background:var(--paper); border:1px solid var(--line); color:var(--ink-dim);
    font-size:12px; padding:8px 14px; border-radius:16px; cursor:pointer;
  }
  .preset-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600; }

  .preview-label{
    border:1.5px dashed var(--line); border-radius:4px; padding:14px; margin-top:16px;
    text-align:center; background:var(--paper);
  }
  .preview-label .p-name{ font-weight:700; font-size:13px; }
  .preview-label .p-price{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
  .preview-label svg{ margin-top:8px; }
  .preview-label .p-code{ font-size:10px; color:var(--ink-dim); }

  .gen-btn, .submit-btn{
    width:100%; margin-top:18px; padding:14px 0; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; font-weight:700; font-size:14px;
    text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .gen-btn:hover, .submit-btn:hover{ background:#14213a; }
  .gen-btn:disabled{ background:var(--line); cursor:not-allowed; }

  .print-page-btn{
    width:100%; margin-top:10px; padding:12px 0; background:transparent; color:var(--ink);
    border:1px solid var(--ink); border-radius:3px; font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; display:none;
  }
  .print-page-btn.show{ display:block; }

  .scan-row{ display:flex; gap:8px; }
  .scan-row input{ flex:1; }
  .scan-btn{
    background:var(--ink); color:var(--paper); border:none; border-radius:3px;
    padding:0 16px; font-size:18px; cursor:pointer;
  }
  .scanner-modal{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999;
    align-items:center; justify-content:center; flex-direction:column; padding:20px;
  }
  .scanner-modal.show{ display:flex; }
  .scanner-modal video{ width:100%; max-width:400px; border-radius:6px; }
  .scanner-modal .close-scan{
    margin-top:16px; background:var(--rust); color:#fff; border:none;
    padding:10px 24px; border-radius:20px; font-weight:700; cursor:pointer;
  }
  .scanner-hint{ color:#fff; font-size:12px; margin-top:10px; text-align:center; }

  .lookup-result{ margin-top:18px; }
  .lookup-row{ border-top:1px solid var(--line); padding:10px 0; font-size:13px; display:flex; justify-content:space-between; }
  .lookup-row:first-child{ border-top:none; }
  .lookup-total{ display:flex; justify-content:space-between; padding-top:12px; margin-top:6px; border-top:2px solid var(--ink); font-weight:700; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:16px 0; }

  #labelPrintArea, #lookupPrintArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #labelPrintArea.printing, #labelPrintArea.printing *{ visibility:visible; }
    #labelPrintArea.printing{
      display:block !important; position:absolute; top:0; left:0; width:100%;
      padding:6mm;
    }
    .label-grid{
      display:grid; grid-template-columns:repeat(3, 1fr); gap:4mm;
    }
    .label-cell{
      border:1px dotted #999; border-radius:2mm; padding:3mm; text-align:center;
      page-break-inside:avoid;
    }
    .label-cell .l-name{ font-weight:bold; font-size:8pt; }
    .label-cell .l-price{ font-size:7pt; }
    .label-cell .l-code{ font-size:6pt; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Chocolate Barcode</h1>
    <p class="sub">Print labels, or look up a release</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="labels">Print Labels</button>
    <button class="tab" data-tab="lookup">Look Up Release</button>
  </div>

  <div class="panel active" id="panelLabels">
    <div class="card">
      <div class="card-title">Choose Chocolate</div>
      <label>Category</label>
      <div id="categoryPills" class="category-pills"></div>

      <label>Chocolate Name</label>
      <input type="text" id="fSearch" list="itemList" placeholder="Type to search..." autocomplete="off" />
      <datalist id="itemList"></datalist>

      <label>Pricing Unit</label>
      <div class="qty-presets" id="unitModeTabs">
        <button class="preset-btn active" data-mode="piece">Per Piece</button>
        <button class="preset-btn" data-mode="gram">Per Gram</button>
        <button class="preset-btn" data-mode="kg">Per Kg</button>
      </div>
      <label id="unitAmountLabel">How many pieces per label?</label>
      <input type="number" id="fUnitAmount" min="0" step="0.01" placeholder="e.g. 1" value="1" />

      <label>How Many Labels?</label>
      <input type="number" id="fQty" min="1" placeholder="e.g. 12" />
      <div class="qty-presets" id="labelQtyPresets">
        <button class="preset-btn" data-qty="1">1 Label</button>
        <button class="preset-btn" data-qty="15">Half Sheet (15)</button>
        <button class="preset-btn" data-qty="30">Full Sheet (30)</button>
      </div>

      <div class="preview-label" id="previewLabel" style="display:none;">
        <div class="p-name" id="pvName"></div>
        <div class="p-price" id="pvPrice"></div>
        <svg id="pvBarcode"></svg>
        <div class="p-code" id="pvCode"></div>
      </div>

      <button class="gen-btn" id="genBtn">Generate Labels</button>
      <button class="print-page-btn" id="printLabelsBtn">Print This Sheet</button>
    </div>
  </div>

  <div class="panel" id="panelLookup">
    <div class="card">
      <div class="card-title">Scan or Enter Release No</div>
      <div class="scan-row">
        <input type="text" id="fReleaseNo" placeholder="e.g. REL-000001" autocomplete="off" />
        <button class="scan-btn" id="scanBtn" title="Scan barcode">📷</button>
      </div>
      <button class="submit-btn" id="lookupBtn">Look Up</button>

      <div class="lookup-result" id="lookupResult"></div>
    </div>
  </div>
</div>

<div class="scanner-modal" id="scannerModal">
  <video id="scannerVideo" autoplay playsinline muted></video>
  <div class="scanner-hint">Point the camera at a release barcode</div>
  <button class="close-scan" id="closeScanBtn">Cancel</button>
</div>

<div id="labelPrintArea">
  <div class="label-grid" id="labelGrid"></div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbznLqWonLj9K1NR0kb3KfzZcSTxbxCMEJJS9CQFYd6GYcGPv9Alwk2dO4mpjwxGVg/exec';

  let items = [];
  let selectedItem = null;
  let latestBatch = null;
  let unitMode = 'piece';

  function fmtBD(n){
    return Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD';
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  document.getElementById('tabs').addEventListener('click', e=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
    document.getElementById('panelLabels').classList.toggle('active', btn.dataset.tab === 'labels');
    document.getElementById('panelLookup').classList.toggle('active', btn.dataset.tab === 'lookup');
  });

  let activeCategory = null;

  async function loadData(){
    const t = Date.now();
    try{ items = await (await fetch(API_URL + '?action=getItems&_ts=' + t)).json(); }catch(e){ console.error(e); }
    populateItemList(null);
    renderCategoryPills();
  }

  function populateItemList(filterCategory){
    const filtered = filterCategory ? items.filter(it => it['Category'] === filterCategory) : items;
    document.getElementById('itemList').innerHTML =
      filtered.map(it => `<option value="${it['Chocolate Name']}"></option>`).join('');
  }

  function renderCategoryPills(){
    const cats = [...new Set(items.map(it => it['Category']).filter(Boolean))];
    const el = document.getElementById('categoryPills');
    el.innerHTML =
      `<button class="cat-pill${activeCategory === null ? ' active' : ''}" data-cat="">All</button>` +
      cats.map(c =>
        `<button class="cat-pill${c === activeCategory ? ' active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');
    el.querySelectorAll('.cat-pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeCategory = btn.dataset.cat || null;
        renderCategoryPills();
        populateItemList(activeCategory);
      });
    });
  }

  document.getElementById('fSearch').addEventListener('input', function(){
    const match = items.find(it => it['Chocolate Name'] === this.value);
    if(match){
      selectedItem = match;
      loadLatestBatch(match);
      if(match['Category'] && match['Category'] !== activeCategory){
        activeCategory = match['Category'];
        renderCategoryPills();
        populateItemList(activeCategory);
      }
    } else {
      selectedItem = null;
      latestBatch = null;
      document.getElementById('previewLabel').style.display = 'none';
    }
  });

  async function loadLatestBatch(item){
    latestBatch = null;
    try{
      const t = Date.now();
      const res = await (await fetch(API_URL + '?action=getLatestBatchInfo&chocolateName=' + encodeURIComponent(item['Chocolate Name']) + '&_ts=' + t)).json();
      if(res.found) latestBatch = res;
    }catch(e){ console.error(e); }
    showPreview(item);
  }

  document.getElementById('unitModeTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.preset-btn');
    if(!btn) return;
    document.querySelectorAll('#unitModeTabs .preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    unitMode = btn.dataset.mode;
    const label = document.getElementById('unitAmountLabel');
    if(unitMode === 'piece') label.textContent = 'How many pieces per label?';
    else if(unitMode === 'gram') label.textContent = 'How many grams per label?';
    else label.textContent = 'How many kg per label?';
    if(selectedItem) showPreview(selectedItem);
  });

  document.getElementById('fUnitAmount').addEventListener('input', ()=>{
    if(selectedItem) showPreview(selectedItem);
  });

  function computeLabelPrice(){
    if(!latestBatch) return null;
    const n = parseFloat(document.getElementById('fUnitAmount').value) || 0;
    if(n <= 0) return null;
    const pricePerKg = Number(latestBatch.PricePerKg) || 0;
    const weightPerPiece = Number(latestBatch.WeightPerPiece) || 0;
    let kg, label;
    if(unitMode === 'piece'){
      kg = (n * weightPerPiece) / 1000;
      label = n + (n != 1 ? ' pcs' : ' pc');
    } else if(unitMode === 'gram'){
      kg = n / 1000;
      label = n + ' g';
    } else {
      kg = n;
      label = n + ' kg';
    }
    const total = kg * pricePerKg;
    return { total, label };
  }

  function showPreview(item){
    const el = document.getElementById('previewLabel');
    el.style.display = 'block';
    document.getElementById('pvName').textContent = item['Chocolate Name'];

    const priceResult = computeLabelPrice();
    if(priceResult){
      document.getElementById('pvPrice').textContent = priceResult.label + ' — ' + fmtBD(priceResult.total);
    } else if(!latestBatch){
      document.getElementById('pvPrice').textContent = 'No batch data found for this chocolate.';
    } else {
      document.getElementById('pvPrice').textContent = 'Enter an amount above.';
    }

    document.getElementById('pvCode').textContent = item['Product Code'] || '';
    document.getElementById('pvBarcode').innerHTML = '';
    if(item['Product Code']){
      try{
        JsBarcode("#pvBarcode", String(item['Product Code']), { format: "CODE128", width: 1.3, height: 32, displayValue: false });
      }catch(e){}
    }
  }

  document.querySelectorAll('#labelQtyPresets .preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#labelQtyPresets .preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('fQty').value = btn.dataset.qty;
    });
  });
  document.getElementById('fQty').addEventListener('input', ()=>{
    document.querySelectorAll('#labelQtyPresets .preset-btn').forEach(b => b.classList.remove('active'));
  });

  document.getElementById('genBtn').addEventListener('click', ()=>{
    if(!selectedItem || !selectedItem['Product Code']){
      alert('Pick a chocolate with a Product Code first.');
      return;
    }
    const qty = parseInt(document.getElementById('fQty').value) || 0;
    if(qty <= 0){
      alert('Enter how many labels to print.');
      return;
    }
    const priceResult = computeLabelPrice();
    if(!priceResult){
      alert('Enter a valid pricing amount first.');
      return;
    }

    const grid = document.getElementById('labelGrid');
    grid.innerHTML = '';
    const price = priceResult.label + ' — ' + fmtBD(priceResult.total);

    for(let i = 0; i < qty; i++){
      const cell = document.createElement('div');
      cell.className = 'label-cell';
      cell.innerHTML = `
        <div class="l-name">${selectedItem['Chocolate Name']}</div>
        <div class="l-price">${price}</div>
        <svg class="lbl-svg-${i}"></svg>
        <div class="l-code">${selectedItem['Product Code']}</div>
      `;
      grid.appendChild(cell);
    }
    for(let i = 0; i < qty; i++){
      try{
        JsBarcode(`.lbl-svg-${i}`, String(selectedItem['Product Code']), { format: "CODE128", width: 1, height: 22, displayValue: false });
      }catch(e){}
    }
    document.getElementById('printLabelsBtn').classList.add('show');
  });

  document.getElementById('printLabelsBtn').addEventListener('click', ()=>{
    document.getElementById('labelPrintArea').classList.add('printing');
    window.print();
    setTimeout(()=> document.getElementById('labelPrintArea').classList.remove('printing'), 500);
  });

  /* ---------- Look Up Release ---------- */
  document.getElementById('lookupBtn').addEventListener('click', async ()=>{
    const releaseNo = document.getElementById('fReleaseNo').value.trim();
    if(!releaseNo){
      alert('Enter or scan a Release No.');
      return;
    }
    const el = document.getElementById('lookupResult');
    el.innerHTML = '<div class="empty-note">Looking up...</div>';
    try{
      const t = Date.now();
      const data = await (await fetch(API_URL + '?action=getReleaseByNo&releaseNo=' + encodeURIComponent(releaseNo) + '&_ts=' + t)).json();
      renderLookupResult(releaseNo, data);
    }catch(e){
      el.innerHTML = '<div class="empty-note">Could not look up this release.</div>';
    }
  });

  function renderLookupResult(releaseNo, data){
    const el = document.getElementById('lookupResult');
    const items = data.items || [];
    const extras = data.extras || [];
    if(items.length === 0 && extras.length === 0){
      el.innerHTML = '<div class="empty-note">No release found for ' + releaseNo + '.</div>';
      return;
    }

    let total = 0;
    let rowsHtml = items.map(it=>{
      total += Number(it['Total']) || 0;
      const exp = it['ExpiryDate'] ? ' · Exp: ' + fmtDate(it['ExpiryDate']) : '';
      return `<div class="lookup-row"><span>${it['Chocolate Name']} (${it['Qty Release']} ${it['Unit']})${exp}</span><span>${fmtBD(it['Total'])}</span></div>`;
    }).join('');
    rowsHtml += extras.map(ex=>{
      total += Number(ex['Amount']) || 0;
      return `<div class="lookup-row"><span>${ex['Description']}</span><span>${fmtBD(ex['Amount'])}</span></div>`;
    }).join('');

    const branch = items[0] ? items[0]['Branch'] : '';
    const date = items[0] ? items[0]['Realese Date'] : '';
    const type = items[0] ? items[0]['Transaction Type'] : '';

    el.innerHTML = `
      <div style="font-size:12px; color:var(--ink-dim); margin-bottom:8px;">
        ${releaseNo} · ${branch || '—'} · ${fmtDate(date)} · ${type || '—'}
      </div>
      ${rowsHtml}
      <div class="lookup-total"><span>Total</span><span>${fmtBD(total)}</span></div>
    `;
  }

  /* ---------- Barcode scanning (native BarcodeDetector, camera-based) ---------- */
  let scanStream = null;
  let scanLoopActive = false;

  document.getElementById('scanBtn').addEventListener('click', async ()=>{
    if(!('BarcodeDetector' in window)){
      alert('Barcode scanning is not supported in this browser. Please type the Release No manually.');
      return;
    }
    const modal = document.getElementById('scannerModal');
    const video = document.getElementById('scannerVideo');
    modal.classList.add('show');
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = scanStream;
      scanLoopActive = true;
      const detector = new BarcodeDetector({ formats: ['code_128','ean_13','ean_8','upc_a','upc_e','qr_code'] });
      const scanLoop = async ()=>{
        if(!scanLoopActive) return;
        try{
          const codes = await detector.detect(video);
          if(codes.length > 0){
            stopScanner();
            document.getElementById('fReleaseNo').value = codes[0].rawValue;
            document.getElementById('lookupBtn').click();
            return;
          }
        }catch(e){}
        requestAnimationFrame(scanLoop);
      };
      scanLoop();
    }catch(e){
      alert('Could not access the camera. Check permissions and try again.');
      modal.classList.remove('show');
    }
  });

  function stopScanner(){
    scanLoopActive = false;
    if(scanStream){
      scanStream.getTracks().forEach(t => t.stop());
      scanStream = null;
    }
    document.getElementById('scannerModal').classList.remove('show');
  }

  document.getElementById('closeScanBtn').addEventListener('click', stopScanner);

  loadData();
</script>
</body>
</html>
