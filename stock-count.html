<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ede0;
    --paper-2:#e9e0c8;
    --ink:#1c2b45;
    --ink-dim:#5c6a83;
    --rust:#b0442e;
    --gold:#c68a1f;
    --line:#c9bfa0;
    --ok:#3d7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .wind-field{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .wisp{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(198,138,31,0.25), transparent 70%);
    animation-name: windDrift; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes windDrift{
    0%{ transform:translateX(-10vw) translateY(0); opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateX(110vw) translateY(var(--drift,20px)); opacity:0; }
  }

  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; position:relative; z-index:1; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
    transition:color .12s ease;
  }
  .back-link:hover{ color:var(--rust); }

  header{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900;
    font-size:clamp(1.8rem,7vw,2.6rem); margin:0 0 6px; line-height:1;
  }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
    margin-bottom:20px; background:var(--paper-2); padding:5px; border-radius:3px;
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-dim); cursor:pointer; border-radius:2px;
  }
  .branch-tab.active{ background:var(--ink); color:var(--paper); }

  .refresh-link{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer; margin-bottom:14px;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:20px; margin-bottom:18px;
  }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;
  }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-dim); margin-bottom:5px; margin-top:14px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], select{
    width:100%; background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:14px;
    color:var(--ink); outline:none;
  }
  input:focus, select:focus{ border-color:var(--ink); }

  .category-pills{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none; margin-top:6px;
  }
  .category-pills::-webkit-scrollbar{ display:none; }
  .cat-pill{
    flex-shrink:0; background:var(--paper); border:1px solid var(--line); color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif; font-size:11.5px; padding:7px 12px;
    border-radius:16px; cursor:pointer; white-space:nowrap; transition:all .12s ease;
  }
  .cat-pill:hover{ border-color:var(--ink); color:var(--ink); }
  .cat-pill.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600; }

  .count-row{
    border-top:1px solid var(--line); padding:14px 0;
  }
  .count-row:first-child{ border-top:none; }
  .count-row-head{ display:flex; justify-content:space-between; align-items:baseline; font-weight:600; font-size:13.5px; }
  .count-row-meta{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; }
  .count-inputs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .variance-tag{
    font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 8px; border-radius:10px; font-weight:700; margin-left:6px;
  }
  .variance-ok{ background:#e3f0e6; color:var(--ok); }
  .variance-diff{ background:#fbe6d9; color:#c05a1f; }

  .submit-btn{
    width:100%; margin-top:18px; padding:14px 0; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .submit-btn:hover{ background:#14213a; }
  .submit-btn:disabled{ background:var(--line); cursor:not-allowed; }

  .hist-row{ border-top:1px solid var(--line); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:20px 0; }

  .status-pill{
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em;
    padding:2px 8px; border-radius:10px; font-weight:700; white-space:nowrap;
  }
  .status-confirmed{ background:#e3f0e6; color:var(--ok); }
  .status-pending{ background:#fbf1de; color:var(--gold); }
  .status-approved{ background:#e3f0e6; color:var(--ok); }
  .status-rejected{ background:#f6e0e0; color:#7a2020; }
  .status-recount{ background:#fbe6d9; color:#c05a1f; }
</style>
</head>
<body>
<div class="wind-field" id="windField"></div>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Stock Count</h1>
    <p class="sub">Physical count per branch</p>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>

  <button class="refresh-link" id="refreshBtn">↻ Refresh Data</button>

  <div class="card">
    <div class="card-title">Session Info</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div>
        <label>Count Date</label>
        <input type="date" id="fCountDate" />
      </div>
      <div>
        <label>Counted By</label>
        <input type="text" id="fCountedBy" list="countedByList" placeholder="Type or pick a name" autocomplete="off" />
        <datalist id="countedByList"></datalist>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Items to Count</div>
    <label>Search Chocolate</label>
    <input type="text" id="fItemSearch" placeholder="Type to filter..." autocomplete="off" />
    <label>Category</label>
    <div id="categoryPills" class="category-pills"></div>
    <div id="itemsList"></div>
    <button class="submit-btn" id="saveBtn">Save Count Session</button>
  </div>

  <div class="card">
    <div class="card-title">Recent Count History (This Branch)</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbznLqWonLj9K1NR0kb3KfzZcSTxbxCMEJJS9CQFYd6GYcGPv9Alwk2dO4mpjwxGVg/exec';
  const BRANCHES = ['ModaMall','Hamala','Galali'];
  const REASONS = ['', 'Damaged', 'Expired', 'Miscount', 'Theft/Loss', 'Found Extra', 'Other'];
  let currentBranch = 'ModaMall';

  let stockItems = [];
  let history = [];
  let countedByNames = [];
  let itemSearchText = '';
  let activeCategory = null;

  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  /* ---------- Wind-drift background (ambient) ---------- */
  function spawnWisp(){
    const field = document.getElementById('windField');
    const w = document.createElement('div');
    w.className = 'wisp';
    const size = 60 + Math.random() * 120;
    const top = Math.random() * 100;
    const duration = 10 + Math.random() * 8;
    const drift = (Math.random() * 60 - 30) + 'px';
    w.style.width = size + 'px';
    w.style.height = size + 'px';
    w.style.top = top + 'vh';
    w.style.setProperty('--drift', drift);
    w.style.animationDuration = duration + 's';
    field.appendChild(w);
    setTimeout(()=> w.remove(), duration * 1000 + 200);
  }
  for(let i=0;i<4;i++){ setTimeout(spawnWisp, i * 1200); }
  setInterval(spawnWisp, 3200);

  /* ---------- Jazzy closing chime (played when a count session is saved) ---------- */
  function playJazzClose(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const chord = [261.63, 329.63, 392.00, 493.88]; // Cmaj7-ish, warm resolving chord
      chord.forEach((freq, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = ctx.currentTime + i * 0.05;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.08, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.1);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start); osc.stop(start + 1.2);
      });
    }catch(e){}
  }

  async function loadData(){
    const t = Date.now();
    try{ stockItems = await (await fetch(API_URL + '?action=getStockableItems&branch=' + currentBranch + '&_ts=' + t)).json(); }catch(e){ console.error(e); }
    try{ history = await (await fetch(API_URL + '?action=getCountHistory&branch=' + currentBranch + '&_ts=' + t)).json(); }catch(e){ console.error(e); }
    try{ countedByNames = await (await fetch(API_URL + '?action=getReceivedBy&_ts=' + t)).json(); }catch(e){ console.error(e); }

    document.getElementById('countedByList').innerHTML =
      countedByNames.map(n => `<option value="${n}"></option>`).join('');

    activeCategory = null;
    itemSearchText = '';
    document.getElementById('fItemSearch').value = '';
    renderCategoryPills();
    renderItems();
    renderHistory();
  }

  function renderCategoryPills(){
    const cats = [...new Set(stockItems.map(it => it.Category).filter(Boolean))];
    const el = document.getElementById('categoryPills');
    if(cats.length === 0){ el.innerHTML = ''; return; }
    el.innerHTML =
      `<button class="cat-pill${activeCategory === null ? ' active' : ''}" data-cat="">All</button>` +
      cats.map(c =>
        `<button class="cat-pill${c === activeCategory ? ' active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');
    el.querySelectorAll('.cat-pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeCategory = btn.dataset.cat || null;
        renderCategoryPills();
        renderItems();
      });
    });
  }

  document.getElementById('fItemSearch').addEventListener('input', function(){
    itemSearchText = this.value.trim().toLowerCase();
    renderItems();
  });

  function renderItems(){
    const el = document.getElementById('itemsList');

    const visible = stockItems
      .map((it, idx) => ({ it, idx }))
      .filter(({it}) => {
        const matchesSearch = !itemSearchText || it.ChocolateName.toLowerCase().includes(itemSearchText);
        const matchesCategory = !activeCategory || it.Category === activeCategory;
        return matchesSearch && matchesCategory;
      });

    if(stockItems.length === 0){
      el.innerHTML = '<div class="empty-note">No stock on hand for ' + currentBranch + '.</div>';
      return;
    }
    if(visible.length === 0){
      el.innerHTML = '<div class="empty-note">No items match your search.</div>';
      return;
    }
    el.innerHTML = visible.map(({it, idx}) => `
      <div class="count-row" data-idx="${idx}">
        <div class="count-row-head">
          <span>${it.ChocolateName}</span>
          <span>System: ${it.SystemStock}</span>
        </div>
        <div class="count-row-meta">Batch: ${it.Batch || '—'} · Expiry: ${fmtDate(it.ExpiryDate)}</div>
        <div class="count-inputs">
          <div>
            <label>Physical Count</label>
            <input type="number" min="0" step="0.01" class="physicalInput" placeholder="0" />
          </div>
          <div>
            <label>Variance Reason</label>
            <select class="reasonSelect">
              ${REASONS.map(r => `<option value="${r}">${r || 'Select if variance...'}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderHistory(){
    const el = document.getElementById('historyList');
    if(history.length === 0){
      el.innerHTML = '<div class="empty-note">No count sessions yet for ' + currentBranch + '.</div>';
      return;
    }
    const sorted = [...history].sort((a,b) => new Date(b['Date']) - new Date(a['Date']));
    const statusClass = {
      'Confirmed':'status-confirmed', 'Pending Approval':'status-pending',
      'Approved':'status-approved', 'Rejected':'status-rejected', 'Recount Requested':'status-recount'
    };
    el.innerHTML = sorted.slice(0, 40).map(h => `
      <div class="hist-row">
        <div class="hist-top">
          <span>${h['Chocolate'] || '—'}</span>
          <span class="status-pill ${statusClass[h['Status']] || ''}">${h['Status'] || '—'}</span>
        </div>
        <div class="hist-meta">${fmtDate(h['Date'])} · System: ${h['System Stock']} · Physical: ${h['Physical Count']} · Variance: ${h['Variance']}</div>
      </div>
    `).join('');
  }

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    loadData();
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const countDate = document.getElementById('fCountDate').value;
    const countedBy = document.getElementById('fCountedBy').value.trim();

    if(!countDate || !countedBy){
      alert('Count date and Counted By are required.');
      return;
    }

    const rows = document.querySelectorAll('.count-row');
    const lines = [];
    rows.forEach(row=>{
      const idx = Number(row.dataset.idx);
      const physicalInput = row.querySelector('.physicalInput');
      const reasonSelect = row.querySelector('.reasonSelect');
      if(physicalInput.value !== ''){
        const item = stockItems[idx];
        lines.push({
          chocolateName: item.ChocolateName,
          batch: item.Batch,
          expiryDate: item.ExpiryDate,
          databaseId: item.DatabaseID,
          systemStock: item.SystemStock,
          physicalCount: Number(physicalInput.value),
          reason: reasonSelect.value
        });
      }
    });

    if(lines.length === 0){
      alert('Enter at least one physical count before saving.');
      return;
    }

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving...';

    try{
      const params = new URLSearchParams({
        action: 'saveCountSession',
        branch: currentBranch,
        countedBy,
        countDate,
        lines: JSON.stringify(lines)
      });
      await fetch(`${API_URL}?${params.toString()}`);
      playJazzClose();
      document.getElementById('fCountedBy').value = '';
      await loadData();
    }catch(e){
      alert('Could not save the count session. Check your connection and try again.');
    }
    saveBtn.disabled = false; saveBtn.textContent = 'Save Count Session';
  });

  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn');
    btn.textContent = 'Refreshing...';
    await loadData();
    btn.textContent = '↻ Refresh Data';
  });

  loadData();
</script>
</body>
</html>
