<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lalabella — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cacao:#0d0806;
    --cacao-2:#1a100c;
    --foil:#e8c46a;
    --foil-hot:#ffdd7a;
    --cream:#f5ecdf;
    --dim:#8a7568;
    --line:#332218;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cacao);
    color:var(--cream);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .ribbon{
    position:fixed;
    top:0; left:0; right:0;
    height:14px;
    background:repeating-linear-gradient(
      -45deg,
      var(--foil), var(--foil) 18px,
      var(--foil-hot) 18px, var(--foil-hot) 36px
    );
  }
  .wrap{ max-width:480px; width:100%; text-align:center; }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.4em;
    text-transform:uppercase;
    color:var(--foil);
    margin-bottom:14px;
    font-weight:700;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(2.2rem, 8vw, 3.2rem);
    line-height:0.98;
    margin:0 0 40px;
    letter-spacing:-0.01em;
  }
  .card-link{
    display:block;
    text-decoration:none;
    color:var(--cream);
    background:var(--cacao-2);
    border:2px solid var(--line);
    padding:24px;
    margin-bottom:16px;
    text-align:left;
    transition:border-color .15s ease;
  }
  .card-link:hover{ border-color:var(--foil); }
  .card-eyebrow{
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--foil);
    margin-bottom:6px;
    font-weight:700;
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:6px;
  }
  .card-desc{
    font-size:13px;
    color:var(--dim);
  }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <div class="wrap">
    <div class="eyebrow">Lalabella</div>
    <h1>Tools</h1>

    <a class="card-link" href="chocolate-calc.html">
      <div class="card-eyebrow">Pricing</div>
      <div class="card-title">Price Calculator</div>
      <div class="card-desc">Look up chocolates, compute by pieces, grams, or kg, and print a receipt.</div>
    </a>

    <a class="card-link" href="supply-log.html">
      <div class="card-eyebrow">Operations</div>
      <div class="card-title">Supply Log</div>
      <div class="card-desc">Log invoices per branch, track weekly budgets, and view history.</div>
    </a>
  </div>
</body>
</html>
