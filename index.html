<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lalabella — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cacao:#0d0806;
    --cacao-2:#1a100c;
    --foil:#e8c46a;
    --foil-hot:#ffdd7a;
    --cream:#f5ecdf;
    --dim:#8a7568;
    --line:#332218;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cacao);
    color:var(--cream);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }

  .ribbon{
    position:fixed;
    top:0; left:0; right:0;
    height:14px;
    background:repeating-linear-gradient(
      -45deg,
      var(--foil), var(--foil) 18px,
      var(--foil-hot) 18px, var(--foil-hot) 36px
    );
    background-size:200% 100%;
    z-index:10;
    animation: ribbonShift 6s linear infinite;
  }
  @keyframes ribbonShift{
    from{ background-position:0% 0; }
    to{ background-position:-100% 0; }
  }

  .choco-field{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .choco{
    position:absolute;
    top:-40px;
    font-size:20px;
    opacity:0;
    animation-name: chocoDrift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  @keyframes chocoDrift{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    10%{ opacity:0.35; }
    90%{ opacity:0.3; }
    100%{ transform:translate(var(--drift,20px), 110vh) rotate(320deg); opacity:0; }
  }

  @keyframes titleIn{
    0%{ opacity:0; transform:translateY(18px) scale(.96); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes cardIn{
    0%{ opacity:0; transform:translateY(22px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes shimmerSweep{
    0%{ background-position:-150% 0; }
    100%{ background-position:250% 0; }
  }

  .wrap{ max-width:480px; width:100%; text-align:center; position:relative; z-index:1; }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.4em;
    text-transform:uppercase;
    color:var(--foil);
    margin-bottom:14px;
    font-weight:700;
    opacity:0;
    animation: titleIn .5s ease .05s both;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(2.2rem, 8vw, 3.2rem);
    line-height:0.98;
    margin:0 0 40px;
    letter-spacing:-0.01em;
    opacity:0;
    animation: titleIn .6s cubic-bezier(.2,.8,.2,1) .15s both;
  }
  .card-link{
    display:block;
    text-decoration:none;
    color:var(--cream);
    background:
      linear-gradient(110deg, transparent 30%, rgba(232,196,106,0.12) 45%, transparent 60%),
      var(--cacao-2);
    background-size:250% 100%, 100% 100%;
    background-position:-150% 0, 0 0;
    border:2px solid var(--line);
    padding:24px;
    margin-bottom:16px;
    text-align:left;
    transition:border-color .18s ease, transform .18s ease;
    opacity:0;
    animation: cardIn .5s cubic-bezier(.2,.8,.2,1) both;
    position:relative;
  }
  .card-link:nth-of-type(1){ animation-delay: .3s; }
  .card-link:nth-of-type(2){ animation-delay: .42s; }
  .card-link:hover{
    border-color:var(--foil);
    transform:translateY(-2px);
    background-position:250% 0, 0 0;
    transition:border-color .18s ease, transform .18s ease, background-position .9s ease;
  }
  .card-eyebrow{
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--foil);
    margin-bottom:6px;
    font-weight:700;
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:6px;
  }
  .card-desc{
    font-size:13px;
    color:var(--dim);
  }

  .music-widget{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
    justify-content:center;
  }
  .music-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--dim);
    width:100%;
    text-align:center;
    margin-bottom:6px;
  }
  .song-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .song-btn:hover{ border-color:var(--foil); color:var(--foil); }
  .song-btn.playing{
    background:var(--foil);
    border-color:var(--foil);
    color:var(--cacao);
  }
  .song-btn .dot{
    width:6px; height:6px; border-radius:50%;
    background:currentColor;
    opacity:0;
  }
  .song-btn.playing .dot{
    opacity:1;
    animation: pulseDot 1s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.6); opacity:.4; }
  }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <div class="choco-field" id="chocoField"></div>
  <div class="wrap">
    <div class="eyebrow">Lalabella</div>
    <h1>Tools</h1>

    <a class="card-link" href="chocolate-calc.html" id="cardCalc">
      <div class="card-eyebrow">Pricing</div>
      <div class="card-title">Price Calculator</div>
      <div class="card-desc">Look up chocolates, compute by pieces, grams, or kg, and print a receipt.</div>
    </a>

    <a class="card-link" href="supply-log.html" id="cardSupply">
      <div class="card-eyebrow">Operations</div>
      <div class="card-title">Supply Log</div>
      <div class="card-desc">Log invoices per branch, track weekly budgets, and view history.</div>
    </a>

    <div class="music-widget">
      <div class="music-label">Background Music</div>
      <button class="song-btn" id="songFirstLove" data-video="IRegy8gBO8A">
        <span class="dot"></span> First Love — Hikaru Utada
      </button>
      <button class="song-btn" id="songBestFriend" data-video="OGACI56J34A">
        <span class="dot"></span> Best Friend — Kiroro
      </button>
    </div>
  </div>

  <div id="ytPlayer" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;"></div>

<script>
  /* ---------- Floating chocolate background ---------- */
  const CHOCO_EMOJI = ['🍫','🍬'];
  function spawnChoco(){
    const field = document.getElementById('chocoField');
    const c = document.createElement('div');
    c.className = 'choco';
    c.textContent = CHOCO_EMOJI[Math.floor(Math.random()*CHOCO_EMOJI.length)];
    const left = Math.random() * 100;
    const duration = 14 + Math.random() * 10;
    const drift = (Math.random() * 100 - 50) + 'px';
    const size = 16 + Math.random() * 14;
    c.style.left = left + 'vw';
    c.style.fontSize = size + 'px';
    c.style.setProperty('--drift', drift);
    c.style.animationDuration = duration + 's';
    field.appendChild(c);
    setTimeout(()=> c.remove(), duration * 1000 + 200);
  }
  for(let i=0;i<7;i++){ setTimeout(spawnChoco, i * 700); }
  setInterval(spawnChoco, 2200);

  /* ---------- Soft chime on open (generated, no files needed) ---------- */
  function playOpenChime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i)=>{
        const start = i * 0.09;
        const dur = 0.5;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ctx.currentTime + start);
        gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.05);
      });
    }catch(e){ /* audio not available */ }
  }
  // Most browsers require a user gesture before audio can play;
  // try immediately, and also arm it on first touch/click as a fallback.
  let chimePlayed = false;
  function tryChime(){
    if(chimePlayed) return;
    chimePlayed = true;
    playOpenChime();
  }
  window.addEventListener('load', tryChime);
  document.addEventListener('pointerdown', tryChime, { once:true });

  /* soft click tone when a tool card is tapped */
  function playCardClick(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 700;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    }catch(e){}
  }
  ['cardCalc','cardSupply'].forEach(id=>{
    document.getElementById(id).addEventListener('click', (e)=>{
      playCardClick();
    });
  });

  /* ---------- Background music (YouTube IFrame Player) ---------- */
  let ytPlayer = null;
  let ytReady = false;
  let currentSongBtn = null;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1',
      playerVars: { autoplay: 0, controls: 0, disablekb: 1 },
      events: {
        'onReady': ()=>{ ytReady = true; }
      }
    });
  };

  function setPlayingState(btn){
    document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('playing'));
    if(btn) btn.classList.add('playing');
    currentSongBtn = btn;
  }

  function toggleSong(btn){
    if(!ytReady){ return; }
    const videoId = btn.dataset.video;
    const isThisPlaying = btn.classList.contains('playing');

    if(isThisPlaying){
      ytPlayer.pauseVideo();
      setPlayingState(null);
    } else {
      ytPlayer.loadVideoById(videoId);
      ytPlayer.setLoop(true);
      ytPlayer.playVideo();
      setPlayingState(btn);
    }
  }

  document.getElementById('songFirstLove').addEventListener('click', function(){
    playCardClick();
    toggleSong(this);
  });
  document.getElementById('songBestFriend').addEventListener('click', function(){
    playCardClick();
    toggleSong(this);
  });
</script>
</body>
</html>
