<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lalabella — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cacao:#0d0806;
    --cacao-2:#1a100c;
    --foil:#e8c46a;
    --foil-hot:#ffdd7a;
    --cream:#f5ecdf;
    --dim:#8a7568;
    --line:#332218;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cacao);
    color:var(--cream);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 40px;
    overflow-x:hidden;
    position:relative;
  }

  .ribbon{
    position:fixed; top:0; left:0; right:0; height:14px;
    background:repeating-linear-gradient(-45deg, var(--foil), var(--foil) 18px, var(--foil-hot) 18px, var(--foil-hot) 36px);
    background-size:200% 100%;
    z-index:10;
    animation: ribbonShift 6s linear infinite;
  }
  @keyframes ribbonShift{ from{background-position:0% 0;} to{background-position:-100% 0;} }

  .petal-field{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .petal{
    position:absolute; top:-40px; opacity:0;
    animation-name: petalFall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    10%{ opacity:0.4; }
    90%{ opacity:0.35; }
    100%{ transform:translate(var(--drift,20px), 110vh) rotate(280deg); opacity:0; }
  }

  @keyframes titleIn{
    0%{ opacity:0; transform:translateY(18px) scale(.96); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .content{ position:relative; z-index:1; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }

  .eyebrow{
    font-size:11px; letter-spacing:0.4em; text-transform:uppercase; color:var(--foil);
    margin-bottom:8px; font-weight:700; opacity:0; animation: titleIn .5s ease .05s both;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900; font-size:clamp(2rem, 8vw, 2.8rem);
    line-height:0.98; margin:0 0 30px; letter-spacing:-0.01em;
    opacity:0; animation: titleIn .6s cubic-bezier(.2,.8,.2,1) .15s both;
  }

  /* --- 3D carousel --- */
  .carousel-wrap{ perspective:900px; width:100%; max-width:280px; height:280px; position:relative; opacity:0; animation: titleIn .6s cubic-bezier(.2,.8,.2,1) .28s both; }
  .card3d{
    position:absolute; inset:0; text-decoration:none; color:var(--cream);
    background:
      linear-gradient(110deg, transparent 30%, rgba(232,196,106,0.14) 45%, transparent 60%),
      var(--cacao-2);
    background-size:250% 100%, 100% 100%;
    background-position:-150% 0, 0 0;
    border:2px solid var(--foil); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    transition:background-position .9s ease, border-color .18s ease, transform .3s ease;
    transform-style:preserve-3d;
  }
  .card3d.flip{ transform:rotateY(90deg); }
  .card3d:hover{ background-position:250% 0, 0 0; }
  .card3d .icon{ font-size:44px; margin-bottom:16px; }
  .card3d .card-eyebrow{ font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--foil); margin-bottom:6px; font-weight:700; }
  .card3d .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin-bottom:8px; }
  .card3d .card-desc{ font-size:12.5px; color:var(--dim); }

  .nav-row{ display:flex; justify-content:space-between; width:100%; max-width:280px; margin-top:14px; }
  .nav-btn{
    background:none; border:1px solid var(--line); color:var(--cream);
    width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:16px;
  }
  .nav-btn:hover{ border-color:var(--foil); color:var(--foil); }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:10px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .15s ease; }
  .dot.active{ background:var(--foil); }

  /* --- Flower mascot --- */
  .char{ position:relative; width:100px; height:130px; animation: bodyBob 1.1s ease-in-out infinite; margin-top:38px; }
  @keyframes bodyBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .head{
    position:absolute; top:14px; left:50%; width:48px; height:48px;
    background:#f2d9b0; border-radius:50%; transform:translateX(-50%);
    animation: headNod 1.1s ease-in-out infinite;
  }
  @keyframes headNod{ 0%,100%{transform:translateX(-50%) rotate(-6deg);} 50%{transform:translateX(-50%) rotate(6deg);} }
  .head::before, .head::after{ content:""; position:absolute; width:4px; height:4px; background:var(--cacao); border-radius:50%; top:22px; }
  .head::before{ left:13px; } .head::after{ left:31px; }
  .crown{ position:absolute; top:2px; left:50%; transform:translateX(-50%); width:60px; text-align:center; font-size:16px; letter-spacing:-2px; }
  .ear-flower{ position:absolute; top:26px; font-size:16px; }
  .ear-flower.left{ left:-6px; } .ear-flower.right{ right:-6px; }
  .torso{ position:absolute; top:58px; left:50%; width:42px; height:52px; background:#5a7a52; border-radius:16px 16px 12px 12px; transform:translateX(-50%); }
  .arm{ position:absolute; top:64px; width:9px; height:34px; background:#5a7a52; border-radius:6px; transform-origin:top center; }
  .arm.left{ left:14px; animation: armL 1.1s ease-in-out infinite; }
  .arm.right{ right:14px; animation: armR 1.1s ease-in-out infinite; }
  @keyframes armL{ 0%,100%{transform:rotate(-16deg);} 50%{transform:rotate(6deg);} }
  @keyframes armR{ 0%,100%{transform:rotate(16deg);} 50%{transform:rotate(-6deg);} }
  .float-flower{ position:absolute; font-size:14px; opacity:.85; animation: floatAround 3s ease-in-out infinite; }
  .float-flower.f1{ top:-4px; left:-18px; animation-delay:0s; }
  .float-flower.f2{ top:20px; right:-20px; animation-delay:.6s; }
  .float-flower.f3{ bottom:10px; left:-22px; animation-delay:1.2s; }
  @keyframes floatAround{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-8px) rotate(15deg);} }
  .mascot-label{ font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:12px; }

  /* --- Playlist --- */
  .playlist{ display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
  .song-btn{
    background:transparent; border:1px solid var(--line); color:var(--dim);
    font-family:'Space Grotesk',sans-serif; font-size:11px; padding:8px 14px; border-radius:20px; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:all .15s ease;
  }
  .song-btn:hover{ border-color:var(--foil); color:var(--foil); }
  .song-btn.playing{ background:var(--foil); border-color:var(--foil); color:var(--cacao); }
  .song-btn .dot2{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0; }
  .song-btn.playing .dot2{ opacity:1; animation: pulseDot 1s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.6); opacity:.4;} }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <div class="petal-field" id="petalField"></div>

  <div class="content">
    <div class="eyebrow">Lalabella</div>
    <h1>Tools</h1>

    <div class="carousel-wrap">
      <a class="card3d" href="chocolate-calc.html" id="carouselCard">
        <div class="icon" id="ccIcon">🍫</div>
        <div class="card-eyebrow" id="ccEyebrow">Pricing</div>
        <div class="card-title" id="ccTitle">Price Calculator</div>
        <div class="card-desc" id="ccDesc">Look up chocolates, compute by pieces, grams, or kg, and print a receipt.</div>
      </a>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" aria-label="Previous">‹</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next">›</button>
    </div>
    <div class="dots">
      <div class="dot active" id="dot0"></div>
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <div class="char">
      <div class="float-flower f1">🌸</div>
      <div class="float-flower f2">🌺</div>
      <div class="float-flower f3">🌷</div>
      <div class="crown">🌼🌸🌼</div>
      <div class="ear-flower left">🌺</div>
      <div class="ear-flower right">🌺</div>
      <div class="head"></div>
      <div class="torso"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
    </div>
    <div class="mascot-label">taking a break with the tunes</div>

    <div class="playlist">
      <button class="song-btn playing" id="btnPiano"><span class="dot2"></span>🎹 Ambient Piano</button>
      <button class="song-btn" id="btnFirstLove" data-video="IRegy8gBO8A"><span class="dot2"></span>First Love</button>
      <button class="song-btn" id="btnBestFriend" data-video="OGACI56J34A"><span class="dot2"></span>Best Friend</button>
    </div>
  </div>

  <div id="ytPlayer" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;"></div>

<script>
  /* ---------- Mixed chocolate + flower falling background ---------- */
  const PETAL_EMOJI = ['🌸','🌺','🌷','🌼','🍫','🍬'];
  function spawnPetal(){
    const field = document.getElementById('petalField');
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = PETAL_EMOJI[Math.floor(Math.random()*PETAL_EMOJI.length)];
    const left = Math.random() * 100;
    const duration = 13 + Math.random() * 10;
    const drift = (Math.random() * 90 - 45) + 'px';
    p.style.left = left + 'vw';
    p.style.fontSize = (15 + Math.random()*12) + 'px';
    p.style.setProperty('--drift', drift);
    p.style.animationDuration = duration + 's';
    field.appendChild(p);
    setTimeout(()=> p.remove(), duration*1000 + 200);
  }
  for(let i=0;i<7;i++){ setTimeout(spawnPetal, i * 750); }
  setInterval(spawnPetal, 2100);

  /* ---------- Carousel navigation (3 tools, flip-swap transition) ---------- */
  const TOOLS = [
    { href:'chocolate-calc.html', icon:'🍫', eyebrow:'Pricing', title:'Price Calculator', desc:'Look up chocolates, compute by pieces, grams, or kg, and print a receipt.' },
    { href:'supply-log.html', icon:'🌸', eyebrow:'Operations', title:'Supply Log', desc:'Log invoices per branch, track weekly budgets, and view history.' },
    { href:'chocolate-receiving.html', icon:'📦', eyebrow:'Inventory', title:'Chocolate Receiving', desc:'Receive stock per branch, track expiry status, and print records.' },
    { href:'initial-stock.html', icon:'🗝️', eyebrow:'Setup', title:'Initial Stock', desc:'Set the opening balance for a branch, once — lock it once entered.' }
  ];
  let currentIndex = 0;
  const carouselCard = document.getElementById('carouselCard');

  function renderCard(index){
    const t = TOOLS[index];
    carouselCard.href = t.href;
    document.getElementById('ccIcon').textContent = t.icon;
    document.getElementById('ccEyebrow').textContent = t.eyebrow;
    document.getElementById('ccTitle').textContent = t.title;
    document.getElementById('ccDesc').textContent = t.desc;
    for(let i=0;i<TOOLS.length;i++){
      document.getElementById('dot'+i).classList.toggle('active', i === index);
    }
  }

  function goTo(newIndex){
    newIndex = (newIndex + TOOLS.length) % TOOLS.length;
    carouselCard.classList.add('flip');
    setTimeout(()=>{
      currentIndex = newIndex;
      renderCard(currentIndex);
      carouselCard.classList.remove('flip');
    }, 300);
  }

  document.getElementById('prevBtn').addEventListener('click', ()=> goTo(currentIndex - 1));
  document.getElementById('nextBtn').addEventListener('click', ()=> goTo(currentIndex + 1));
  renderCard(0);

  /* ---------- Soft click tone ---------- */
  function playClick(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 700;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.18);
    }catch(e){}
  }
  ['prevBtn','nextBtn','carouselCard'].forEach(id=>{
    document.getElementById(id).addEventListener('click', playClick);
  });

  /* ---------- Ambient piano background music (original, generated) ---------- */
  let musicCtx = null;
  let musicMuted = false;
  let musicStarted = false;
  let loopTimer = null;
  const PIANO_LOOP_SECONDS = 9.5;
  const PIANO_PATTERN = [
    { note: 523.25, t: 0.0,  dur: 1.6, vol: 0.05 },
    { note: 659.25, t: 1.3,  dur: 1.6, vol: 0.045},
    { note: 783.99, t: 2.6,  dur: 2.0, vol: 0.04 },
    { note: 987.77, t: 4.2,  dur: 1.4, vol: 0.035},
    { note: 880.00, t: 5.3,  dur: 1.8, vol: 0.04 },
    { note: 659.25, t: 6.6,  dur: 2.2, vol: 0.045},
    { note: 523.25, t: 7.8,  dur: 1.8, vol: 0.04 },
  ];
  function pianoNote(freq, startTime, dur, vol){
    const ctx = musicCtx;
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.type = 'sine'; osc2.type = 'triangle';
    osc1.frequency.value = freq; osc2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.18;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc1.connect(gain); osc2.connect(g2).connect(gain); gain.connect(ctx.destination);
    osc1.start(startTime); osc1.stop(startTime + dur + 0.05);
    osc2.start(startTime); osc2.stop(startTime + dur + 0.05);
  }
  function scheduleLoop(loopStart){
    if(musicMuted) return;
    PIANO_PATTERN.forEach(n=> pianoNote(n.note, loopStart + n.t, n.dur, n.vol));
    loopTimer = setTimeout(()=> scheduleLoop(musicCtx.currentTime), PIANO_LOOP_SECONDS * 1000);
  }
  function startMusic(){
    if(musicStarted) return;
    musicStarted = true;
    musicCtx = new (window.AudioContext || window.webkitAudioContext)();
    scheduleLoop(musicCtx.currentTime + 0.1);
  }
  function stopMusic(){
    musicMuted = true;
    if(loopTimer) clearTimeout(loopTimer);
    if(musicCtx){ musicCtx.suspend(); }
  }
  function resumeMusic(){
    musicMuted = false;
    if(musicCtx){ musicCtx.resume(); scheduleLoop(musicCtx.currentTime + 0.1); }
    else { startMusic(); }
  }
  startMusic();
  document.addEventListener('pointerdown', startMusic, { once:true });

  /* ---------- YouTube playlist (First Love / Best Friend) ---------- */
  let ytPlayer = null;
  let ytReady = false;
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytPlayer', {
      height:'1', width:'1',
      playerVars:{ autoplay:0, controls:0, disablekb:1 },
      events:{ 'onReady': ()=>{ ytReady = true; } }
    });
  };

  function setActiveSong(btn){
    document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('playing'));
    btn.classList.add('playing');
  }

  document.getElementById('btnPiano').addEventListener('click', function(){
    playClick();
    if(ytPlayer && ytReady) ytPlayer.pauseVideo();
    resumeMusic();
    setActiveSong(this);
  });

  ['btnFirstLove','btnBestFriend'].forEach(id=>{
    document.getElementById(id).addEventListener('click', function(){
      playClick();
      if(!ytReady) return;
      stopMusic();
      ytPlayer.loadVideoById(this.dataset.video);
      ytPlayer.playVideo();
      setActiveSong(this);
    });
  });
</script>
</body>
</html>
