<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flower Receiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0;
    --blush-2:#f6e0da;
    --mint:#eaf3ec;
    --rose:#c9506b;
    --rose-deep:#9e2f4a;
    --gold:#d9a441;
    --leaf:#5f8f63;
    --ink:#3a2530;
    --ink-dim:#8a7078;
    --line:#f0d9d9;
    --ok:#3d7a4f;
    --warn:#c68a1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 5%, rgba(201,80,107,0.08), transparent 40%),
      radial-gradient(circle at 92% 12%, rgba(95,143,99,0.10), transparent 40%),
      radial-gradient(circle at 30% 95%, rgba(217,164,65,0.08), transparent 45%),
      linear-gradient(160deg, var(--blush) 0%, var(--mint) 100%);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:26px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
  }
  .back-link:hover{ color:var(--rose-deep); }

  header{
    text-align:center; margin-bottom:22px; padding:24px 18px;
    background:linear-gradient(135deg, #fff 0%, var(--blush) 60%, var(--blush-2) 100%);
    border-radius:18px; border:1px solid var(--line);
    box-shadow:0 8px 26px rgba(158,47,74,0.08);
    position:relative; overflow:hidden;
  }
  header::before{
    content:'🌹'; position:absolute; font-size:64px; opacity:0.08;
    left:-12px; top:-16px; transform:rotate(-16deg);
  }
  header::after{
    content:'🌷'; position:absolute; font-size:56px; opacity:0.09;
    right:-8px; bottom:-14px; transform:rotate(14deg);
  }
  .eyebrow{
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold);
    margin-bottom:6px; font-weight:600; position:relative; z-index:1;
  }
  h1{
    font-family:'Great Vibes', cursive; font-weight:400; color:var(--rose-deep);
    font-size:clamp(2.1rem,8vw,2.8rem); margin:0; line-height:1;
    position:relative; z-index:1;
  }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
    margin-bottom:18px; background:#fff; padding:5px; border-radius:14px;
    border:1px solid var(--line);
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px;
    color:var(--ink-dim); cursor:pointer; border-radius:10px; transition:all .2s ease;
  }
  .branch-tab.active{
    background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff;
    box-shadow:0 3px 10px rgba(158,47,74,0.25);
  }

  .layout{ display:flex; flex-direction:column; gap:18px; }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:22px; box-shadow:0 4px 16px rgba(158,47,74,0.05);
  }
  .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 14px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .card-title .count-badge{
    font-family:'Space Mono',monospace; font-size:11px; background:var(--blush);
    color:var(--rose-deep); padding:3px 10px; border-radius:12px; font-weight:700;
  }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-dim); margin-bottom:5px; margin-top:14px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], select{
    width:100%; background:var(--blush); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:14px;
    color:var(--ink); outline:none;
  }
  input:focus, select:focus{ border-color:var(--rose); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-2 > div{ min-width:0; }

  .type-toggle{
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
    background:var(--blush); padding:4px; border-radius:12px; margin-bottom:16px;
  }
  .type-btn{
    padding:10px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-dim); cursor:pointer; border-radius:9px; transition:all .2s ease;
  }
  .type-btn.active{ background:#fff; color:var(--rose-deep); box-shadow:0 2px 8px rgba(158,47,74,0.12); }

  .rate-preview{
    margin-top:14px; padding:14px; border-radius:12px; border:1px dashed var(--line);
    background:var(--blush); font-size:13px;
  }
  .rate-preview.approved{ border-color:var(--ok); background:var(--mint); }
  .rate-preview.pending{ border-color:var(--warn); background:#fbf1de; }
  .rate-row{ display:flex; justify-content:space-between; padding:3px 0; }
  .rate-row b{ font-family:'Space Mono',monospace; }
  .rate-status{ font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; margin-top:6px; }
  .rate-status.approved{ color:var(--ok); }
  .rate-status.pending{ color:var(--warn); }

  .add-btn, .submit-btn{
    width:100%; margin-top:20px; padding:14px; background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff; border:none; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; box-shadow:0 6px 16px rgba(158,47,74,0.25);
  }
  .add-btn{ background:linear-gradient(135deg, var(--leaf), #3f6b45); box-shadow:0 6px 16px rgba(95,143,99,0.25); }
  .submit-btn:disabled, .add-btn:disabled{ opacity:0.5; cursor:default; box-shadow:none; }

  .budget-bar{ height:8px; background:var(--blush-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .budget-fill{ height:100%; background:var(--leaf); transition:width .3s ease; }
  .budget-fill.over{ background:var(--rose); }
  .budget-text{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:6px; }

  .cart-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    border-top:1px solid var(--blush-2); padding:12px 0; font-size:13px;
  }
  .cart-row:first-child{ border-top:none; }
  .cart-row-name{ font-weight:600; }
  .cart-row-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .cart-remove-btn{
    background:none; border:none; color:var(--rose); font-size:16px; cursor:pointer;
    padding:0 0 0 10px; flex-shrink:0;
  }
  .cart-total-row{
    display:flex; justify-content:space-between; padding-top:12px; margin-top:6px;
    border-top:1px dashed var(--line); font-weight:700; font-size:14px;
  }

  .hist-row{ border-top:1px solid var(--blush-2); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-name{ font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .hist-actions{ margin-top:6px; }
  .edit-link{
    background:none; border:none; color:var(--gold); font-size:11px; cursor:pointer;
    text-decoration:underline; padding:0;
  }
  .edit-link:hover{ color:var(--rose-deep); }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:16px 0; }
  .loading{ text-align:center; padding:20px 0; color:var(--ink-dim); font-size:13px; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(58,37,48,0.5);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; padding:24px; width:100%; max-width:400px;
    max-height:88vh; overflow-y:auto;
  }
  .modal h3{ font-family:'Fraunces',serif; margin:0 0 16px; }
  .modal .submit-btn{ margin-top:20px; }
  .modal-close{
    background:none; border:none; color:var(--ink-dim); font-size:12px;
    display:block; margin:10px auto 0; cursor:pointer;
  }

  /* ---------- Desktop: widen + two-column layout ---------- */
  @media (min-width: 900px){
    .wrap{ max-width:1080px; padding:34px 30px 70px; }
    .branch-tabs{ max-width:420px; }
    .layout{ flex-direction:row; align-items:flex-start; }
    .col-main{ flex:1.3; display:flex; flex-direction:column; gap:18px; }
    .col-side{ flex:1; display:flex; flex-direction:column; gap:18px; position:sticky; top:24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella Flowers</div>
    <h1>Flower Receiving</h1>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>

  <div class="layout">
    <div class="col-main">
      <div class="card">
        <div class="card-title">🧾 Add an Item</div>

        <div class="type-toggle" id="typeToggle">
          <button class="type-btn active" data-type="Flower">🌸 Flower</button>
          <button class="type-btn" data-type="Supply">🎀 Supply</button>
        </div>

        <div id="flowerFields">
          <label>Flower Name</label>
          <input type="text" id="fFlowerName" list="flowerList" placeholder="e.g. Rose" />
          <datalist id="flowerList"></datalist>

          <label>Origin</label>
          <input type="text" id="fOrigin" list="originList" placeholder="e.g. Ecuador" />
          <datalist id="originList"></datalist>

          <div class="grid-2">
            <div>
              <label>Unit</label>
              <select id="fUnit">
                <option value="Bunch">Bunch</option>
                <option value="Stem">Stem</option>
                <option value="Piece">Piece</option>
                <option value="Plant">Plant</option>
                <option value="Box">Box</option>
              </select>
            </div>
            <div id="stemsWrap">
              <label>Stems per Bunch</label>
              <input type="number" id="fStemsPerBunch" min="1" step="1" value="1" />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Quantity</label>
              <input type="number" id="fQty" min="0" step="1" />
            </div>
            <div>
              <label>Supplier Rate (BD)</label>
              <input type="number" id="fSupplierRate" min="0" step="0.001" />
            </div>
          </div>

          <div class="rate-preview" id="stockEqPreview" style="display:none; background:var(--mint); border-color:var(--leaf);">
            <div class="rate-row"><span>Stock Equivalent (reference)</span><b id="pvStockEq">—</b></div>
          </div>

          <div class="rate-preview" id="ratePreview" style="display:none;">
            <div class="rate-row"><span>Suggested Company Rate</span><b id="pvRate">—</b></div>
            <div class="rate-status" id="pvStatus"></div>
          </div>
        </div>

        <div id="supplyFields" style="display:none;">
          <label>Supply Name</label>
          <input type="text" id="sSupplyName" list="supplyList" placeholder="e.g. Oasis Box, Card Holder" />
          <datalist id="supplyList"></datalist>

          <div class="grid-2">
            <div>
              <label>Unit</label>
              <input type="text" id="sUnit" placeholder="e.g. Piece, Box, Set" />
            </div>
            <div>
              <label>Quantity</label>
              <input type="number" id="sQty" min="0" step="1" />
            </div>
          </div>

          <label>Cost (BD)</label>
          <input type="number" id="sCost" min="0" step="0.001" placeholder="Raw cost — no markup applied" />
        </div>

        <button class="add-btn" id="addItemBtn">+ Add to List</button>
      </div>

      <div class="card" id="cartCard" style="display:none;">
        <div class="card-title">🧺 This Receiving <span class="count-badge" id="cartCount">0</span></div>
        <div id="cartList"></div>
        <div class="cart-total-row"><span>Grand Total</span><span id="cartGrandTotal">0.000 BD</span></div>
      </div>

      <div class="card">
        <div class="card-title">📝 Invoice Details</div>

        <label>Date</label>
        <input type="date" id="fDate" />

        <label>Supplier</label>
        <input type="text" id="fSupplier" list="supplierList" />
        <datalist id="supplierList"></datalist>

        <div class="grid-2">
          <div>
            <label>Invoice No.</label>
            <input type="text" id="fInvoiceNo" />
          </div>
          <div>
            <label>Tax %</label>
            <input type="number" id="fTaxPercent" value="10" step="0.1" />
          </div>
        </div>

        <label>Received By</label>
        <input type="text" id="fReceivedBy" list="staffList" />
        <datalist id="staffList"></datalist>

        <button class="submit-btn" id="submitBtn" disabled>Save Receiving</button>
      </div>
    </div>

    <div class="col-side">
      <div class="card">
        <div class="card-title">🌿 Weekly Budget</div>
        <div id="budgetBlock"><div class="loading">Loading…</div></div>
      </div>

      <div class="card">
        <div class="card-title">📋 Recent Receiving</div>
        <div id="historyList"><div class="loading">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <h3>Edit Receiving Entry</h3>
    <label>Date</label>
    <input type="date" id="eDate" />
    <label>Flower Name</label>
    <input type="text" id="eFlowerName" />
    <div class="grid-2">
      <div>
        <label>Origin</label>
        <input type="text" id="eOrigin" />
      </div>
      <div>
        <label>Unit</label>
        <select id="eUnit">
          <option value="Bunch">Bunch</option>
          <option value="Stem">Stem</option>
          <option value="Piece">Piece</option>
          <option value="Plant">Plant</option>
          <option value="Box">Box</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label>Stems per Bunch</label>
        <input type="number" id="eStemsPerBunch" min="1" step="1" />
      </div>
      <div>
        <label>Quantity</label>
        <input type="number" id="eQty" min="0" step="1" />
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label>Supplier Rate (BD)</label>
        <input type="number" id="eSupplierRate" min="0" step="0.001" />
      </div>
      <div>
        <label>Tax %</label>
        <input type="number" id="eTaxPercent" step="0.1" />
      </div>
    </div>
    <label>Supplier</label>
    <input type="text" id="eSupplier" />
    <label>Invoice No.</label>
    <input type="text" id="eInvoiceNo" />
    <label>Received By</label>
    <input type="text" id="eReceivedBy" />
    <button class="submit-btn" id="saveEditBtn">Save Changes</button>
    <button class="modal-close" id="closeEditModalBtn">Cancel</button>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzC-h3iV0AJU0A3mKhj_0V5-yOeLoJYlupFlPnKHelbyhcSiqUbK6LTjgo4qZF03Bs/exec';
  let currentBranch = 'ModaMall';
  let flowerItems = [];
  let entries = [];
  let cart = [];
  let currentType = 'Flower';

  function fmtBD(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD'; }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  document.getElementById('typeToggle').addEventListener('click', e=>{
    const btn = e.target.closest('.type-btn');
    if(!btn) return;
    currentType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('flowerFields').style.display = currentType === 'Flower' ? 'block' : 'none';
    document.getElementById('supplyFields').style.display = currentType === 'Supply' ? 'block' : 'none';
  });

  function toggleStemsField(){
    const u = document.getElementById('fUnit').value;
    document.getElementById('stemsWrap').style.display =
      (u === 'Bunch' || u === 'Stem') ? 'block' : 'none';
  }
  document.getElementById('fUnit').addEventListener('change', ()=>{ toggleStemsField(); updateRatePreview(); });
  toggleStemsField();

  function computeSuggestedRate(rate, unit, stems){
    const isStemBased = (unit === 'Bunch' || unit === 'Stem');
    const perStem = isStemBased && stems > 0 ? rate / stems : rate;
    return perStem * 3 * 1.10;
  }

  const STOCK_EQ_LABELS = {
    'Bunch': 'Stems', 'Stem': 'Stems', 'Piece': 'Pieces', 'Plant': 'Plants', 'Box': 'Boxes'
  };
  function computeStockEquivalent(qty, unit, stems){
    if(unit === 'Bunch' && stems > 0) return qty * stems;
    return qty;
  }

  function updateStockEqPreview(){
    const preview = document.getElementById('stockEqPreview');
    const qty = parseFloat(document.getElementById('fQty').value);
    if(!qty){ preview.style.display = 'none'; return; }

    const unit = document.getElementById('fUnit').value;
    const stems = parseFloat(document.getElementById('fStemsPerBunch').value) || 1;
    const eq = computeStockEquivalent(qty, unit, stems);
    const label = STOCK_EQ_LABELS[unit] || unit;

    preview.style.display = 'block';
    document.getElementById('pvStockEq').textContent = eq + ' ' + label;
  }

  function updateRatePreview(){
    const preview = document.getElementById('ratePreview');
    const rate = parseFloat(document.getElementById('fSupplierRate').value);
    if(!rate){ preview.style.display = 'none'; return; }

    const unit = document.getElementById('fUnit').value;
    const stems = parseFloat(document.getElementById('fStemsPerBunch').value) || 1;
    const suggested = computeSuggestedRate(rate, unit, stems);
    const flowerName = document.getElementById('fFlowerName').value.trim();
    const match = flowerItems.find(it => (it.Flowers||'').trim().toLowerCase() === flowerName.toLowerCase() &&
      (it.Origin === 'Legacy' || it.Origin === 'Unknown Origin'));
    const existingRate = match ? Number(match.Rate) : null;

    preview.style.display = 'block';
    document.getElementById('pvRate').textContent = fmtBD(suggested);

    const statusEl = document.getElementById('pvStatus');
    if(existingRate !== null && Math.abs(suggested - existingRate) > 0.005){
      preview.className = 'rate-preview pending';
      statusEl.className = 'rate-status pending';
      statusEl.textContent = '⚠ Will need approval — differs from legacy rate ' + fmtBD(existingRate);
    } else {
      preview.className = 'rate-preview approved';
      statusEl.className = 'rate-status approved';
      statusEl.textContent = '✓ Will auto-approve';
    }
  }

  ['fSupplierRate','fStemsPerBunch','fFlowerName'].forEach(id=>{
    document.getElementById(id).addEventListener('input', updateRatePreview);
  });
  ['fQty','fStemsPerBunch'].forEach(id=>{
    document.getElementById(id).addEventListener('input', updateStockEqPreview);
  });
  document.getElementById('fUnit').addEventListener('change', updateStockEqPreview);

  function renderBudget(data){
    const el = document.getElementById('budgetBlock');
    const pct = Math.min(100, data.percentUsed);
    const over = data.actual > data.weeklyLimit;
    el.innerHTML = `
      <div class="budget-text"><span>${fmtBD(data.actual)} of ${fmtBD(data.weeklyLimit)}</span><span>${data.percentUsed}%</span></div>
      <div class="budget-bar"><div class="budget-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      <div class="budget-text"><span>Remaining</span><span>${fmtBD(data.remaining)}</span></div>
    `;
  }

  function renderCart(){
    const cartCard = document.getElementById('cartCard');
    const submitBtn = document.getElementById('submitBtn');
    if(cart.length === 0){
      cartCard.style.display = 'none';
      submitBtn.disabled = true;
      return;
    }
    cartCard.style.display = 'block';
    submitBtn.disabled = false;
    document.getElementById('cartCount').textContent = cart.length;

    let grandTotal = 0;
    document.getElementById('cartList').innerHTML = cart.map((it, i) => {
      const isSupply = it.type === 'Supply';
      const rate = isSupply ? it.cost : it.supplierRate;
      const subtotal = it.qty * rate;
      const tax = subtotal * (parseFloat(document.getElementById('fTaxPercent').value || 10) / 100);
      const total = subtotal + tax;
      grandTotal += total;
      const name = isSupply ? it.supplyName : it.flowerName;
      const sub = isSupply ? '🎀 Supply' : (it.origin || 'N/A');
      return `
        <div class="cart-row">
          <div>
            <div class="cart-row-name">${name} <span style="color:var(--ink-dim); font-weight:400;">(${sub})</span></div>
            <div class="cart-row-meta">${it.qty} ${it.unit} × ${fmtBD(rate)} = ${fmtBD(total)}</div>
          </div>
          <button class="cart-remove-btn" data-idx="${i}">✕</button>
        </div>
      `;
    }).join('');
    document.getElementById('cartGrandTotal').textContent = fmtBD(grandTotal);

    document.querySelectorAll('.cart-remove-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        cart.splice(Number(btn.dataset.idx), 1);
        renderCart();
      });
    });
  }

  function renderHistory(){
    const el = document.getElementById('historyList');
    if(entries.length === 0){
      el.innerHTML = '<div class="empty-note">No receiving logged yet for this branch.</div>';
      return;
    }
    el.innerHTML = entries.slice(0, 20).map(e => `
      <div class="hist-row">
        <div class="hist-name">${e.Type === 'Supply' ? '🎀 ' : ''}${e.Flower || '—'} <span style="color:var(--ink-dim); font-weight:400;">(${e.Type === 'Supply' ? 'Supply' : (e.Origin || 'N/A')})</span></div>
        <div class="hist-meta">${fmtDate(e.Date)} · Qty ${e.Qty} ${e.Unit || ''} · ${fmtBD(e.Rate)}/${e.Unit || 'unit'} · Total ${fmtBD(e.Amount)}</div>
        <div class="hist-meta">Supplier: ${e.Supplier || '—'} · Received by: ${e['Received By'] || '—'}</div>
        ${e.ID ? `<div class="hist-actions"><button class="edit-link" data-id="${e.ID}">Edit</button></div>` : ''}
      </div>
    `).join('');

    el.querySelectorAll('.edit-link').forEach(btn=>{
      btn.addEventListener('click', ()=> openEditModal(btn.dataset.id));
    });
  }

  let editingId = null;
  function openEditModal(id){
    const entry = entries.find(e => e.ID === id);
    if(!entry) return;
    editingId = id;
    document.getElementById('eDate').value = entry.Date ? String(entry.Date).slice(0,10) : '';
    document.getElementById('eFlowerName').value = entry.Flower || '';
    document.getElementById('eOrigin').value = entry.Origin || '';
    document.getElementById('eUnit').value = entry.Unit || 'Bunch';
    document.getElementById('eStemsPerBunch').value = entry['Stems per Bunch'] || 1;
    document.getElementById('eQty').value = entry.Qty || '';
    document.getElementById('eSupplierRate').value = entry.Rate || '';
    document.getElementById('eTaxPercent').value = entry['Tax %'] || 10;
    document.getElementById('eSupplier').value = entry.Supplier || '';
    document.getElementById('eInvoiceNo').value = entry['Invoice No'] || '';
    document.getElementById('eReceivedBy').value = entry['Received By'] || '';
    document.getElementById('editModalOverlay').classList.add('show');
  }

  document.getElementById('closeEditModalBtn').addEventListener('click', ()=>{
    document.getElementById('editModalOverlay').classList.remove('show');
    editingId = null;
  });

  document.getElementById('saveEditBtn').addEventListener('click', async ()=>{
    if(!editingId) return;
    const saveBtn = document.getElementById('saveEditBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    const params = new URLSearchParams({
      action: 'editEntry',
      id: editingId,
      date: document.getElementById('eDate').value,
      flowerName: document.getElementById('eFlowerName').value.trim(),
      origin: document.getElementById('eOrigin').value.trim(),
      unit: document.getElementById('eUnit').value,
      stemsPerBunch: document.getElementById('eStemsPerBunch').value,
      qty: document.getElementById('eQty').value,
      supplierRate: document.getElementById('eSupplierRate').value,
      taxPercent: document.getElementById('eTaxPercent').value,
      supplier: document.getElementById('eSupplier').value.trim(),
      invoiceNo: document.getElementById('eInvoiceNo').value.trim(),
      receivedBy: document.getElementById('eReceivedBy').value.trim()
    });

    try{
      const res = await fetch(API_URL + '?' + params.toString());
      const data = await res.json();
      if(data.error){
        alert(data.error);
      } else {
        document.getElementById('editModalOverlay').classList.remove('show');
        editingId = null;
        await loadData();
      }
    }catch(e){
      alert('Could not save changes. Check your connection and try again.');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Changes';
  });

  async function loadData(){
    const t = Date.now();
    const results = await Promise.all([
      fetch(API_URL + '?action=getFlowerItems&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getSuppliers&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getStaff&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getOrigins&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getSupplyItems&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getEntries&branch=' + currentBranch + '&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getWeeklyBudget&branch=' + currentBranch + '&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return null; })
    ]);

    const [items, suppliers, staff, origins, supplyItems, entriesRes, budget] = results;
    flowerItems = items;
    entries = entriesRes;

    document.getElementById('flowerList').innerHTML =
      [...new Set(items.map(it => it.Flowers))].filter(Boolean).map(n => `<option value="${n}"></option>`).join('');
    document.getElementById('originList').innerHTML =
      origins.map(o => `<option value="${o}"></option>`).join('');
    document.getElementById('supplierList').innerHTML =
      suppliers.map(s => `<option value="${s}"></option>`).join('');
    document.getElementById('staffList').innerHTML =
      staff.map(s => `<option value="${s}"></option>`).join('');
    document.getElementById('supplyList').innerHTML =
      [...new Set(supplyItems.map(it => it['Supply Name']))].filter(Boolean).map(n => `<option value="${n}"></option>`).join('');

    renderHistory();
    if(budget) renderBudget(budget);
  }

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    cart = [];
    renderCart();
    loadData();
  });

  document.getElementById('addItemBtn').addEventListener('click', ()=>{
    if(currentType === 'Supply'){
      const supplyName = document.getElementById('sSupplyName').value.trim();
      const qty = parseFloat(document.getElementById('sQty').value);
      const cost = parseFloat(document.getElementById('sCost').value);

      if(!supplyName || !qty || !cost){
        alert('Please fill in Supply Name, Quantity, and Cost.');
        return;
      }

      cart.push({
        type: 'Supply',
        supplyName,
        unit: document.getElementById('sUnit').value.trim() || 'Piece',
        qty, cost
      });
      renderCart();

      document.getElementById('sSupplyName').value = '';
      document.getElementById('sUnit').value = '';
      document.getElementById('sQty').value = '';
      document.getElementById('sCost').value = '';
      document.getElementById('sSupplyName').focus();
      return;
    }

    const flowerName = document.getElementById('fFlowerName').value.trim();
    const origin = document.getElementById('fOrigin').value.trim();
    const qty = parseFloat(document.getElementById('fQty').value);
    const supplierRate = parseFloat(document.getElementById('fSupplierRate').value);

    if(!flowerName || !qty || !supplierRate){
      alert('Please fill in Flower Name, Quantity, and Supplier Rate.');
      return;
    }

    if(origin.toLowerCase() === 'legacy' || origin.toLowerCase() === 'unknown origin'){
      alert('"Legacy" is reserved for the initial stock baseline only and cannot be used for a new purchase. Please enter the actual Origin from the supplier invoice or box label.');
      return;
    }

    cart.push({
      type: 'Flower',
      flowerName,
      origin,
      unit: document.getElementById('fUnit').value,
      stemsPerBunch: parseFloat(document.getElementById('fStemsPerBunch').value) || 1,
      qty, supplierRate
    });
    renderCart();

    document.getElementById('fFlowerName').value = '';
    document.getElementById('fOrigin').value = '';
    document.getElementById('fQty').value = '';
    document.getElementById('fSupplierRate').value = '';
    document.getElementById('ratePreview').style.display = 'none';
    document.getElementById('fFlowerName').focus();
  });

  document.getElementById('submitBtn').addEventListener('click', async ()=>{
    if(cart.length === 0) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const params = new URLSearchParams({
      action: 'saveReceiving',
      items: JSON.stringify(cart),
      branch: currentBranch,
      supplier: document.getElementById('fSupplier').value.trim(),
      invoiceNo: document.getElementById('fInvoiceNo').value.trim(),
      receivedBy: document.getElementById('fReceivedBy').value.trim(),
      date: document.getElementById('fDate').value,
      taxPercent: document.getElementById('fTaxPercent').value
    });

    try{
      const res = await fetch(API_URL + '?' + params.toString());
      const data = await res.json();
      if(data.error){
        alert(data.error);
      } else {
        const pendingCount = data.results.filter(r => r.approvalStatus === 'Pending Approval').length;
        const msg = pendingCount > 0
          ? `Saved ${data.results.length} item(s)! ${pendingCount} rate(s) need approval before they become official.`
          : `Saved ${data.results.length} item(s) — all rates auto-approved.`;
        alert(msg);
        cart = [];
        renderCart();
        document.getElementById('fInvoiceNo').value = '';
        await loadData();
      }
    }catch(e){
      alert('Could not save. Check your connection and try again.');
    }
    btn.disabled = false;
    btn.textContent = 'Save Receiving';
  });

  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  loadData();
</script>
</body>
</html>
